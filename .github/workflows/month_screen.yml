name: 衔接月线扫描（指标1/指标2）

on:
  # 手动触发（随时可跑，强制无视月末判断）
  workflow_dispatch: {}
  # 外部定时（cron-job.org → repository_dispatch，按仓库惯例）
  repository_dispatch:
    types: [month-screen-run]
  # 每个交易日盘后（北京 16:40）；由 gate 判定「是否本月最后一个交易日」，其余日快速跳过
  schedule:
    - cron: '40 8 * * 1-5'

permissions:
  contents: write

concurrency:
  group: month-screen
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 判定交易日 + 是否月末最后交易日（手动/补跑）
        id: g
        env:
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, glob, sys
          from datetime import date, timedelta
          sys.path.insert(0, 'quant_scripts')
          from trade_day_check import judge
          today = date.today()
          is_td = judge(today)[0]
          d, first_td, last_td = today.replace(day=1), None, None
          while d.month == today.month:
              if judge(d)[0]:
                  first_td = first_td or d
                  last_td = d
              d += timedelta(days=1)
          run = 0
          if is_td:
              if today == last_td:
                  run = 1
              elif today == first_td:
                  prev = (today.replace(day=1) - timedelta(days=1)).strftime('%Y-%m')
                  if not (glob.glob(f'outputs/衔接_{prev}.md') or glob.glob(f'outputs/月线选股_{prev}.md')):
                      run = 1
          if os.environ.get('FORCE_RUN') == '1':
              run = 1
          print(f"run={run}")
          print(f"note=today={today} is_trade_day={is_td} first_td={first_td} last_td={last_td} force={os.environ.get('FORCE_RUN')}")

  scan:
    needs: gate
    if: needs.gate.outputs.run == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装依赖
        run: pip install -q pandas numpy
      - name: 衔接月线扫描 + 上传知识库 + 提交产物
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
          IMA_OPENAPI_CLIENTID: ${{ secrets.IMA_OPENAPI_CLIENTID }}
          IMA_OPENAPI_APIKEY: ${{ secrets.IMA_OPENAPI_APIKEY }}
          IMA_KB_ID: ${{ secrets.IMA_KB_ID }}
          IMA_FOLDER_ID: folder_7485264708529742
          IMA_OVERWRITE: '1'
        run: |
          python3 quant_scripts/month_screen.py --push
          CM=$(date +%Y-%m)
          PM=$(date -d "$(date +%Y-%m-01) -1 month" +%Y-%m 2>/dev/null || date -v-1m +%Y-%m)
          OK=""
          for M in "$PM" "$CM"; do
            F="outputs/衔接_${M}.md"
            if [ -f "$F" ]; then
              echo "报告: $F ($(wc -c < "$F") bytes)"
              python3 upload_ima.py --file "$F" --name "$(basename "$F")" || echo "::warning::$F 上传知识库失败"
              OK="$OK $F"
            fi
          done
          if [ -z "$OK" ]; then echo "::error::未生成衔接月线报告"; exit 1; fi
          python3 git_api_commit.py --msg "chore: 衔接月线扫描 $(date +%Y-%m)" \
            $OK outputs/month_screen_latest.json || echo "::warning::衔接月线产物提交失败"

      - name: 产物校验
        if: always()
        continue-on-error: true
        run: |
          N=$(ls -1 outputs/衔接_*.md 2>/dev/null | wc -l)
          if [ "$N" -eq 0 ]; then
            echo "::error::衔接月线报告缺失"; exit 1
          fi
          for F in outputs/衔接_*.md; do
            [ -s "$F" ] || { echo "::error::$F 为空"; exit 1; }
            echo "产物 OK: $F ($(wc -c < "$F") bytes)"
          done
