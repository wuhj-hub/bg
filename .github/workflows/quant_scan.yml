name: 全盘量化扫描

on:
  # 外部精确触发（cron-job.org → repository_dispatch）
  repository_dispatch:
    types: [quant-scan-run]
  # ⚠️ 2026-09-10 方案A：移除原生 schedule，避免与 cron-job.org 重复触发
  # schedule:
  #   - cron: "5 7 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write  # write for changelog auto-update

concurrency:
  # 2026-08-27：拆分自 full_market_scan.yml（旧run挂死无法取消，改新group规避）
  group: panhou-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 300  # 5h，余量充足（优化后实际约2.5-3.5h）
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 沙箱路径兼容层：部分脚本硬编码 /sandbox/workspace（沙箱路径），GitHub runner 上不存在
      # 通过软链接把 /sandbox/workspace 指向仓库根，无需逐个改脚本
      - name: 沙箱路径兼容层（/sandbox/workspace → 仓库根）
        run: |
          sudo mkdir -p /sandbox
          sudo ln -sfn $GITHUB_WORKSPACE /sandbox/workspace
          ls /sandbox/workspace/ > /dev/null 2>&1 && echo "✅ 兼容层就绪: /sandbox/workspace -> $GITHUB_WORKSPACE"

      - name: Setup Node.js（westock npx 依赖）
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 Python 依赖（pandas+numpy for 猛兽）
        run: |
          pip install pandas numpy

      # ─── 第一步：生成主板清单 ───
      # ⚠️ 路径规范（2026-09-16）：gen_mainboard.py 真源在**仓库根目录**，workflow 一律以 `python3 gen_mainboard.py` 调用。
      #    quant_scripts/ 下同名副本已于 2026-09-16 删除。新增脚本请放 quant_scripts/ 并以 `python3 quant_scripts/xxx.py` 调用。
      - name: 生成沪深主板清单（失败回退缓存 all_mainboard.csv，不阻断）
        continue-on-error: true
        run: |
          python3 gen_mainboard.py || echo "⚠️ gen_mainboard失败，回退仓库缓存"
          if [ ! -s all_mainboard.csv ] && [ -f ../all_mainboard.csv ]; then cp ../all_mainboard.csv all_mainboard.csv; fi
          if [ ! -s all_mainboard.csv ]; then echo "❌ 无主板清单可用"; exit 1; fi
          echo "主板清单: $(wc -l < all_mainboard.csv) 行"

      - name: IMA 凭证早期预检（失效立即微信告警，不阻断扫描）
        continue-on-error: true
        env:
          IMA_OPENAPI_CLIENTID: ${{ secrets.IMA_OPENAPI_CLIENTID }}
          IMA_OPENAPI_APIKEY: ${{ secrets.IMA_OPENAPI_APIKEY }}
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          python3 ima_cred_check.py --probe || true

      # ─── 预热westock包（避免扫描时每只股票首次调用下载开销）───
      - name: 预热westock数据包
        # ⚠️ 2026-09-15：原只预热 hot board（板块接口），未预热 kline →
        #    鱼身阶段1「上证指数K线」作为首个 kline 调用在 runner 上冷启动失败（temp=0/数据缺失）
        # ⚠️ 2026-09-18：|| true 改受控告警——预热失败是「runner 大面积丢数据」的前兆信号
        env:
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          set +e
          npx -y westock-data-skillhub@1.0.3 hot board --limit 3 > /dev/null 2>&1
          R1=$?
          npx -y westock-data-skillhub@1.0.3 kline sh000001 --period day --limit 5 > /dev/null 2>&1
          R2=$?
          set -e
          if [ "$R1" != "0" ] || [ "$R2" != "0" ]; then
            echo "::warning::westock 预热部分失败(board=$R1, kline=$R2)"
            curl -s "https://pushplus.plus/send" -d "token=${PUSH_TOKEN}&title=⚠️westock预热失败&content=数据包预热失败(board=$R1,kline=$R2),本轮扫描可能大面积丢数据,请留意当日产物审计告警&template=txt" > /dev/null || true
          else
            echo "✅ 预热完成"
          fi

      # ⚠️ 2026-09-15 顺序优化：板块映射原排在 1-2h 的主扫描之后，一遇拖延就被挤压；
      #    它本身独立（仅依赖东财接口），提前到预热后执行，既避免超时又让 hot_emotion 更早有数据。
      # ─── 第二步.1.3a：板块成分映射（东财·仅 runner 可达；2026-09-15 接入缺口修复）───
      # 背景：sector_component_em.json 自 9/3 起是空壳（sectors:{}）且从未接入 workflow，
      #      导致「板块归属/主线题材」维度长期失效（hot_emotion 里"主线判定：无显著题材"实为常态）。
      #      2026-09-16 更正：push2.eastmoney.com 主域已 502，脚本改用 push2delay（多端点回退）；
      #      push2delay 沙箱亦可达，故本地也能调试，不必只靠 runner。
      - name: 板块成分映射（东财·runner 可达）
        continue-on-error: true
        # ⚠️ 2026-09-15：串行版 486 板块 >20min 被 timeout 砍（仅跑到 302 只）→
        #    脚本已改 8 并发（预计 1-2min 完成），同时把上限放宽到 40min 兜底
        timeout-minutes: 40
        env:
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          set +e
          python3 quant_scripts/runner_fetch_em_sectors.py --out outputs/sector_component_em.json
          RC=$?
          set -e
          if [ "$RC" != "0" ]; then
            echo "::warning::板块成分映射失败(rc=$RC)（hot_emotion 将退化为无题材）"
            curl -s "https://pushplus.plus/send" -d "token=${PUSH_TOKEN}&title=⚠️板块成分映射失败&content=runner_fetch_em_sectors 失败(rc=$RC),hot_emotion 将退化为无题材,主线判定失效&template=txt" > /dev/null || true
          fi
          cp outputs/sector_component_em.json sector_component_em.json 2>/dev/null || true
          python3 -c "import json;d=json.load(open('outputs/sector_component_em.json'));print('板块映射:',len(d.get('sectors',{})),'板块 |',len(d.get('code_sector',{})),'只有题材')" 2>/dev/null || echo "板块映射: 无输出"


      # ─── 第二步：全量量化扫描 ───
      - name: 全量量化扫描（盘后量化）
        env:
          SCAN_WORKERS: "16"
        run: |
          python3 full_market_dualdim.py all_mainboard.csv
          # 归档资金快照（含资金行为四态phase，供按四态胜率跟踪）
          cp panhou_lianghua.csv outputs/资金快照_$(date +%Y-%m-%d).csv || echo "归档失败(不影响扫描)"
          # ⚠️ 2026-09-16 修复：乾坤A产物自 8/25 起从未提交（quant_scan 零引用 qiankun），
          #    导致复盘④/信号仲裁读到 3 周前的陈旧快照。此处补 cp 到仓库根，并纳入提交列表。
          cp outputs/qiankun_a_latest.json qiankun_a_latest.json 2>/dev/null || echo "乾坤A产物缺失(不影响扫描)"

      # ─── 第二步.1：市场宽度指标（黑石marketChangeDist启发：全主板涨跌家数分布）───
      - name: 市场宽度扫描（全主板涨跌家数分布）
        run: python3 market_width.py all_mainboard.csv

      # ─── 第二步.1.3b：热点情绪扫描（hot_emotion 连板梯队+情绪温度+退潮预警，westock自算42s，供次日盘前②.5/②.6引用；2026-09-03接入消除手动漏跑断链）───
      - name: 热点情绪扫描（hot_emotion 连板梯队+情绪温度）
        env:
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          # 先拉取仓库根现有 history 作为累积起点（防 runner 空 history 断链/覆盖丢失，2026-09-03 修复）
          curl -sL --retry 2 "https://raw.githubusercontent.com/wuhj-hub/bg/main/hot_emotion_history.json" -o outputs/hot_emotion_history.json || echo "{}" > outputs/hot_emotion_history.json
          python3 quant_scripts/fetch_hot_kline.py --limit 25 --out outputs/hot_kline.txt --batch 100 --workers 4 --csv all_mainboard.csv
          # ⚠️ 2026-09-15：显式传 --name-file（此前未传且脚本默认路径层数错误 → 连板梯队只剩代码）
          set +e
          python3 quant_scripts/hot_emotion.py --date "$(date +%Y-%m-%d)" --westock \
            --kline-file outputs/hot_kline.txt --end-date "$(date +%Y-%m-%d)" \
            --name-file all_mainboard.csv \
            --sector-file outputs/sector_component_em.json \
            --outdir outputs --history-file outputs/hot_emotion_history.json
          RC=$?
          set -e
          if [ "$RC" != "0" ]; then
            echo "::warning::热点情绪扫描失败(rc=$RC)"
            curl -s "https://pushplus.plus/send" -d "token=${PUSH_TOKEN}&title=⚠️热点情绪扫描失败&content=hot_emotion 失败(rc=$RC),情绪温度/连板梯队停更&template=txt" > /dev/null || true
          fi
          cp outputs/hot_emotion_latest.json hot_emotion_latest.json 2>/dev/null || true
          echo "情绪: $(python3 -c "import json;d=json.load(open('outputs/hot_emotion_latest.json'));print(str(d['score']['score'])+'/'+d['score']['level']+' 涨停'+str(d['total'])+' 连板'+str(d['lianban_cnt'])+' 最高'+str(d['max_lb'])+'板')" 2>/dev/null || echo '计算失败')"

      # ─── 第二步.1.4：市场情绪状态与次日预判（颜劼情绪周期转移矩阵，读market_width涨停数）───
      - name: 市场情绪状态与次日预判（emotion_forecast）
        continue-on-error: true
        run: |
          python3 quant_scripts/emotion_forecast.py
          cp outputs/情绪预判_latest.json 情绪预判_latest.json 2>/dev/null || true
          echo "情绪: $(python3 -c "import json;d=json.load(open('outputs/情绪预判_latest.json'));print(d['state']+'→明日'+str(d['next'])+'('+str(d['next_prob'])+'%)')" 2>/dev/null || echo '无数据')"

      # ─── 第二步.1.5：年线广度指标（V纪元方法论：站上年线个股占比=中期牛熊结构）───
      - name: 年线广度扫描（站上年线个股占比）
        continue-on-error: true
        run: |
          python3 quant_scripts/yearline_breadth.py --list all_mainboard.csv --batch 50
          cp outputs/yearline_breadth_latest.json yearline_breadth_latest.json 2>/dev/null || true
          echo "年线广度: $(python3 -c "import json;d=json.load(open('outputs/yearline_breadth_latest.json'));print(f\"{d['above']}/{d['total']}={d['ratio_pct']}%\" )" 2>/dev/null || echo '计算失败')"

      # ─── 第二步.1.6a：断档分歧板块择时（龚夫财经：连续≥3日强度前五后首次跌出=买点）───
      - name: 断档分歧板块择时信号
        continue-on-error: true
        run: |
          python3 quant_scripts/sector_divergence.py --save
          python3 quant_scripts/sector_divergence.py
          cp outputs/断档分歧_latest.json 断档分歧_latest.json 2>/dev/null || true

      # ─── 第二步.1.6：123/2B/ABC反转扫描（斯波朗迪L3结构确认，panhou四态池驱动）───
      - name: 123/2B/ABC反转信号扫描
        continue-on-error: true
        run: |
          python3 quant_scripts/scan_123_2b.py --pool panhou_lianghua.csv
          cp outputs/123_2b_latest.json 123_2b_latest.json 2>/dev/null || true
          echo "123/2B: $(python3 -c "import json;d=json.load(open('outputs/123_2b_latest.json'));print('买入%d 风险%d ABC%d'%(len(d.get('buy',[])),len(d.get('risk',[])),len(d.get('abc',[]))))" 2>/dev/null || echo '无信号')"

      # ─── 第二步.1.7：RSV均相对强度扫描（腰缠万贯144日，启动/持有/离场）───
      - name: RSV相对强度扫描
        continue-on-error: true
        run: |
          python3 quant_scripts/rsv_strength.py --pool panhou_lianghua.csv
          cp outputs/rsv_strength_latest.json rsv_strength_latest.json 2>/dev/null || true
          echo "RSV: $(python3 -c "import json;d=json.load(open('outputs/rsv_strength_latest.json'));print('启动%d 持有%d 离场%d'%(len(d.get('launch',[])),len(d.get('hold',[])),len(d.get('exit',[]))))" 2>/dev/null || echo '无数据')"

      # ─── 第二步.1.7b：西湖-RSV 多周期相对强度（猛兽框架×西湖方法，全市场 50/144/250）───
      - name: 西湖-RSV 多周期相对强度扫描（全市场）
        continue-on-error: true
        timeout-minutes: 20
        run: |
          python3 quant_scripts/xihu_rsv.py --top 30 \
            --json outputs/xihu_rsv_latest.json \
            --report "outputs/西湖RSV全市场_$(date +%Y-%m-%d).md" || echo "西湖RSV扫描失败"
          cp outputs/xihu_rsv_latest.json xihu_rsv_latest.json 2>/dev/null || true
          echo "西湖RSV: $(python3 -c "import json;d=json.load(open('outputs/xihu_rsv_latest.json'));t=d.get('top',[]);print('评分%d 三周期共振%d'%(d.get('total',0),sum(1 for r in t if '三周期共振' in r.get('resonance',''))))" 2>/dev/null || echo '无数据')"

      # ─── 第二步.1.8：上证月线MACD死叉监控（Seaborg方法论，中期风险信号）───
      - name: 月线MACD监控
        continue-on-error: true
        run: |
          python3 quant_scripts/monthly_macd_monitor.py
          cp outputs/monthly_macd_latest.json monthly_macd_latest.json 2>/dev/null || true

      # ─── 第二步.1.9：市场见顶五维监测（《全球第一炒股笔录》五维；≥3维=顶部区域）───
      - name: 市场见顶五维监测（top_signal）
        continue-on-error: true
        run: |
          python3 quant_scripts/top_signal.py --json > top_signal_latest.json || true
          cp quant_scripts/outputs/top_signal_latest.json top_signal_latest.json 2>/dev/null || true
          cp quant_scripts/outputs/board_top_latest.json board_top_latest.json 2>/dev/null || true
          echo "见顶五维: $(python3 -c "import json;d=json.load(open('top_signal_latest.json'));print('总分'+str(d.get('score','?'))+' '+str(d.get('level','?')))" 2>/dev/null || echo '无数据')"

      # ─── 第二步.1.10：量学扫描（黑马王子《股市天经》三部曲：倍量柱/黄金柱/低量柱/平量柱）───
      - name: 量学扫描（黑马王子体系，与曾星智月线闸门同级）
        continue-on-error: true
        run: |
          python3 quant_scripts/liangxue_screener.py --pool panhou_lianghua.csv
          cp outputs/liangxue_latest.json liangxue_latest.json 2>/dev/null || true
          echo "量学: $(python3 -c "import json;d=json.load(open('outputs/liangxue_latest.json'));print('PASS%d WARN%d BLOCK%d'%(d['pass_count'],d['warn_count'],d['block_count']))" 2>/dev/null || echo '无数据')"

      # ─── 第二步.1.10b：量学×曾星智月线闸门联合（月线定方向+量学定买点·趋势量价双确认）───
      - name: 量学×月线联合输出（月线多头∩量学PASS）
        continue-on-error: true
        run: |
          python3 quant_scripts/liangxue_month_join.py
          cp outputs/liangxue_month_join_latest.json liangxue_month_join_latest.json 2>/dev/null || true
          echo "联合: $(python3 -c "import json;d=json.load(open('outputs/liangxue_month_join_latest.json'));print('月线多头%d 空头%d'%(d['join_count'],d['block_count']))" 2>/dev/null || echo '无数据')"

      # ─── 第二步.1.10c：量学PASS分时量波验证（量波卷·人线为王/4G为皇，TOP20）───
      - name: 量学PASS分时量波验证（人线偏离检测）
        continue-on-error: true
        run: |
          python3 quant_scripts/liangxue_minute_check.py --top 20
          cp outputs/liangxue_minute_check_latest.json liangxue_minute_check_latest.json 2>/dev/null || true
          echo "分时: $(python3 -c "import json;d=json.load(open('outputs/liangxue_minute_check_latest.json'));print('检查%d只'%d['total'])" 2>/dev/null || echo '无数据')"

      # ─── 第二步.2：分时强度分析（黑石minuteMacd启发：信号股分时MACD+封板+尾盘方向）───
      - name: 分时强度分析（信号股分时MACD）
        continue-on-error: true
        run: python3 minute_strength.py --limit 20

      # ─── 第二步.3：板块资金共振（本地复算三维因子，盘前③.3引用；替代黑石外部API，自成一体）───
      - name: 板块资金共振（本地复算·无外部依赖）
        continue-on-error: true
        run: python3 sector_resonance_local.py

      # ─── 第二步.5：动态生成鱼身股票池 ───
      - name: 动态生成鱼身股票池（近20日日均成交额排名前300）
        run: python3 quant_scripts/gen_fish_pool.py

      # ─── 第三步：三系统预运行 ───
      - name: 量化系统预运行（双弦+鱼身+猛兽）
        env:
          IMA_OPENAPI_CLIENTID: ${{ secrets.IMA_OPENAPI_CLIENTID }}
          IMA_OPENAPI_APIKEY: ${{ secrets.IMA_OPENAPI_APIKEY }}
          IMA_KB_ID: ${{ secrets.IMA_KB_ID }}
        run: python3 quant_scripts/run_all_quant.py

      # ─── 第三步.5：一统天下·RSV50三线强度扫描（建仓区×相对强度，盘前③.5引用）───
      - name: 一统天下多周期扫描（建仓区+月线反转+RSV50三线强度）
        continue-on-error: true
        run: python3 quant_scripts/yitong_screener.py

      # ─── 第三步.4：上传三系统原始数据到知识库（供次日盘前报告引用，防止缺失）───
      - name: 上传三系统原始数据（鱼身/双弦/猛兽，盘前引用数据源）
        continue-on-error: true
        env:
          IMA_OPENAPI_CLIENTID: ${{ secrets.IMA_OPENAPI_CLIENTID }}
          IMA_OPENAPI_APIKEY: ${{ secrets.IMA_OPENAPI_APIKEY }}
          IMA_KB_ID: ${{ secrets.IMA_KB_ID }}
          IMA_FOLDER_ID: folder_7485264708529742
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          FAILS=0
          # 鱼身JSON+报告（原内部上传因无凭证静默失败，改为workflow统一上传）
          FISH_JSON=$(ls outputs/fish_body_enhanced_*.json 2>/dev/null | head -1)
          FISH_MD=$(ls outputs/鱼身报告_*.md 2>/dev/null | head -1)
          if [ -n "$FISH_JSON" ]; then
            python3 upload_ima.py --file "$FISH_JSON" --name "$(basename $FISH_JSON)" || FAILS=$((FAILS+1))
          fi
          if [ -n "$FISH_MD" ]; then
            python3 upload_ima.py --file "$FISH_MD" --name "$(basename $FISH_MD)" || FAILS=$((FAILS+1))
          fi
          # 量化汇总JSON（盘前premarket_quant引用）
          QJSON=$(ls outputs/quant_results_$(date +%Y-%m-%d).json 2>/dev/null | head -1)
          if [ -n "$QJSON" ]; then
            python3 upload_ima.py --file "$QJSON" --name "$(basename $QJSON)" || FAILS=$((FAILS+1))
          fi
          # 猛兽原始输出
          if [ -f "outputs/beast_results.txt" ]; then
            python3 upload_ima.py --file "outputs/beast_results.txt" --name "beast_results_$(date +%Y-%m-%d).txt" || FAILS=$((FAILS+1))
          fi
          if [ "$FAILS" -gt 0 ]; then
            echo "::warning::三系统原始数据上传失败 ${FAILS} 个"
            curl -s "https://pushplus.plus/send" -d "token=${PUSH_TOKEN}&title=⚠️三系统数据上传失败&content=quant_scan 知识库上传失败 ${FAILS} 个文件（鱼身/猛兽/量化汇总）,盘前引用数据源可能缺失&template=txt" > /dev/null || true
          fi

      # ─── 第四步（原）：上传全盘量化报告到全盘量化文件夹（尽早传，用户先看到扫描结果）───
      - name: 上传全盘量化报告到全盘量化文件夹
        if: always()  # 防阻断：前置步骤失败仍执行
        timeout-minutes: 15  # 防卡死（2026-08-26：upload_ima无超时曾挂起2.5h+）
        id: upload_main
        env:
          IMA_OPENAPI_CLIENTID: ${{ secrets.IMA_OPENAPI_CLIENTID }}
          IMA_OPENAPI_APIKEY: ${{ secrets.IMA_OPENAPI_APIKEY }}
          IMA_KB_ID: ${{ secrets.IMA_KB_ID }}
          IMA_FOLDER_ID: folder_7485264708529742
        run: |
          IMA_UPLOAD_OK=false
          IMA_CRED_EXPIRED=false
          for i in 1 2 3; do
            if python3 upload_ima.py --file panhou_lianghua.md --name "全盘量化报告_$(date +%Y-%m-%d).md" 2>upload_err.log; then
              IMA_UPLOAD_OK=true
              # 凭证健康度标记：记录最近成功日期（供 guard 自检疑似过期判断）
              python3 ima_cred_check.py --mark-ok || true
              break
            fi
            if grep -Eq "401|skill auth failed|Unauthorized" upload_err.log; then
              IMA_CRED_EXPIRED=true
              echo "::error::ima credential expired (401) — 需重新生成并回填 GitHub secret"
              break
            fi
            echo "upload attempt $i failed, retry after $((i*10))s"
            sleep $((i*10))
          done
          echo "IMA_UPLOAD_OK=$IMA_UPLOAD_OK" >> "$GITHUB_ENV"
          echo "IMA_CRED_EXPIRED=$IMA_CRED_EXPIRED" >> "$GITHUB_ENV"

      # ─── 提交扫描产物到仓库（供盘前报告引用 + 盘后报告workflow读取）───
      # ─── 扫描产物可信度审计（2026-09-15 新增：抓"文件在但内容空/旧"的假绿）───
      - name: 扫描产物可信度审计
        if: always()
        continue-on-error: true
        env:
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          set +e
          python3 quant_scripts/data_guard.py --audit-all
          RC=$?
          set -e
          if [ "$RC" != "0" ]; then
            echo "::warning::扫描产物可信度异常"
            curl -s "https://pushplus.plus/send" -d "token=${PUSH_TOKEN}&title=⚠️扫描产物可信度异常&content=新鲜度/非空/字段完整率/样本率审计发现异常,详见 outputs/data_guard_audit_$(date +%Y-%m-%d).md&template=txt" > /dev/null || true
          fi

      - name: 提交扫描产物到仓库（供盘前引用/报告workflow读取）
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          cp outputs/quant_results_$(date +%Y-%m-%d).json quant_results_latest.json 2>/dev/null || cp outputs/quant_results_latest.json quant_results_latest.json 2>/dev/null || true
          # 鱼身JSON一并提交（盘前premarket_fishbody从GitHub拉取，防止知识库上传失败导致缺失）
          cp outputs/fish_body_enhanced_*.json fish_body_latest.json 2>/dev/null || true
          cp outputs/鱼身报告_*.md 鱼身报告_latest.md 2>/dev/null || true
          # 市场宽度+双模式聚合JSON（盘前②.5/②.5.2从GitHub拉取）
          cp outputs/market_width_latest.json market_width_latest.json 2>/dev/null || true
          cp outputs/mode_aggregate_latest.json mode_aggregate_latest.json 2>/dev/null || true
          # 年线广度（V纪元方法论：站上年线占比，盘前②.5.1从GitHub拉取）
          cp outputs/yearline_breadth_latest.json yearline_breadth_latest.json 2>/dev/null || true
          # 双弦观察层（50-64分独立跟踪，不入月池）
          cp outputs/双弦观察池_latest.json 双弦观察池_latest.json 2>/dev/null || true
          # 板块共振（本地复算）
          cp outputs/板块共振_latest.json 板块共振_latest.json 2>/dev/null || true
          # 热点情绪（hot_emotion：盘前②.5/②.6引用，latest+history+当日md一并提交）
          cp outputs/hot_emotion_latest.json hot_emotion_latest.json 2>/dev/null || true
          cp outputs/hot_emotion_history.json hot_emotion_history.json 2>/dev/null || true
          cp outputs/hot_emotion_$(date +%Y-%m-%d).md hot_emotion_latest.md 2>/dev/null || true
          # 一统天下股池（盘前③.5引用：建仓区×RSV50三线强度）
          cp outputs/一统天下建仓区股池_$(date +%Y-%m-%d).json 一统天下建仓区股池_latest.json 2>/dev/null || true
          cp outputs/一统天下建仓区股池_$(date +%Y-%m-%d).md 一统天下建仓区股池_latest.md 2>/dev/null || true
          if [ -f quant_results_latest.json ] || [ -f fish_body_latest.json ]; then
            # 改用 Contents API 提交（git pull/push 浅克隆+并发冲突曾导致连续失败，API 绕开）
            set +e
            python3 git_api_commit.py --msg "chore: scan results ($(date +%Y-%m-%d))" \
              quant_results_latest.json fish_body_latest.json 鱼身报告_latest.md market_width_latest.json \
              outputs/data_guard_audit_$(date +%Y-%m-%d).md \
              outputs/西湖RSV全市场_$(date +%Y-%m-%d).md \
              outputs/sector_component_em.json \
              outputs/market_width_latest.json \
              outputs/qiankun_a_latest.json qiankun_a_latest.json \
              outputs/资金快照_$(date +%Y-%m-%d).csv \
              mode_aggregate_latest.json 板块共振_latest.json yearline_breadth_latest.json 双弦观察池_latest.json \
              123_2b_latest.json rsv_strength_latest.json xihu_rsv_latest.json monthly_macd_latest.json 断档分歧_latest.json \
              top_signal_latest.json board_top_latest.json 情绪预判_latest.json panhou_lianghua.csv \
              all_mainboard.csv ima_cred_last_ok.json liangxue_latest.json \
              liangxue_month_join_latest.json liangxue_minute_check_latest.json \
              hot_emotion_latest.json hot_emotion_history.json hot_emotion_latest.md \
              pools/pool_$(date +%Y-%m).json \
              一统天下建仓区股池_latest.json 一统天下建仓区股池_latest.md yitong_pool.txt \
              sector_component_em.json
            RC=$?
            set -e
            if [ "$RC" != "0" ]; then
              echo "::warning::扫描产物提交失败(rc=$RC)"
              curl -s "https://pushplus.plus/send" -d "token=${PUSH_TOKEN}&title=⚠️扫描产物提交失败&content=quant_scan git_api_commit 失败(rc=$RC),盘前报告将读到陈旧数据&template=txt" > /dev/null || true
            fi
          fi

      # ─── 关键产物完整性检查（2026-08-28：任一关键步骤失败→微信告警明细）───
      - name: 关键扫描产物检查（缺失即告警）
        if: always()  # 无论成败都检查
        continue-on-error: true
        env:
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          MISSING=""
          for f in panhou_lianghua.csv market_width_latest.json yearline_breadth_latest.json sector_component_em.json 123_2b_latest.json rsv_strength_latest.json monthly_macd_latest.json 板块共振_latest.json liangxue_latest.json liangxue_month_join_latest.json hot_emotion_latest.json hot_emotion_history.json; do
            if [ ! -f "$f" ] && [ ! -f "outputs/$f" ]; then
              MISSING="$MISSING $f"
            fi
          done
          # 三系统产物（commit后复制为latest，检查实际产物）
          if [ ! -f "quant_results_latest.json" ] && ! ls outputs/quant_results_*.json >/dev/null 2>&1; then MISSING="$MISSING quant_results"; fi
          if [ ! -f "fish_body_latest.json" ] && ! ls outputs/fish_body_enhanced_*.json >/dev/null 2>&1; then MISSING="$MISSING fish_body"; fi
          if [ -n "$MISSING" ]; then
            echo "::warning::关键产物缺失:$MISSING"
            curl -s "https://pushplus.plus/send" -d "token=${PUSH_TOKEN}&title=⚠️扫描部分缺失&content=全盘量化扫描完成但关键产物缺失:${MISSING}（查看workflow日志定位）&template=txt" > /dev/null || true
          else
            echo "✅ 关键产物完整（扫描链路9项全齐）"
          fi
