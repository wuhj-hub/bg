name: 仲裁权重自学习（月度·L1 闭环：提议 + 回验）

# ── 用途 ──────────────────────────────────────────────────────────────
# 承载仲裁权重的「有界闭环」第 1 环与第 5 环：
#   ① 提议：learn_weights.py --emit-proposals → outputs/权重提案_{date}.json（+ md）
#   ② 回验：weight_change_review.py --apply   → 对已到期改动算「超额收益」→ keep/rollback
#      （rollback 默认只给结论并告警，**不自动改权重**；人工确认后执行）
#
# ── 独立性声明（2026-10-10）───────────────────────────────────────────
#  · 本 workflow 为**纯新增**，不修改任何现有 workflow / 脚本默认行为；
#  · 只**读** outputs/仲裁信号日志.csv（主流水线 signal_arbiter 产出，本 workflow 不写）；
#  · 写入范围仅限：outputs/仲裁权重学习报告_*.md、outputs/权重提案_*.json、
#    outputs/权重改进回验_*.md、logs/weight_change_ledger.csv（本闭环自有产物）；
#  · 学习/回验属「统计」而非交易动作，故**不设交易日守卫**（避免月初逢 1/1、5/1、10/1 假日整月不跑）。
#
# ── 触发 ──────────────────────────────────────────────────────────────
on:
  schedule:
    - cron: '30 9 1 * *'          # 每月 1 日 北京 17:30（UTC 09:30）
  repository_dispatch:
    types: [weight-learn-run]
  workflow_dispatch: {}

permissions:
  contents: write                  # 提交产物/台账（缺此声明 PUT 会 403）

concurrency:
  group: weight-learn
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      TZ: Asia/Shanghai            # 产物按北京日命名，与体系其它产物一致
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js（westock CLI 依赖）
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 westock CLI（免 npx 冷启动）
        run: npm i -g westock-data-skillhub@1.0.3

      - name: 预热 westock 数据包
        continue-on-error: true
        run: westock-data-skillhub kline sh000001 --period day --limit 5 > /dev/null 2>&1 || echo "预热未成功(非致命)"

      # ── 第 1 环：提议（默认行为不变；开启 --emit-proposals 额外产出结构化提案）──
      - name: ① 权重学习 + 生成结构化提案
        run: python3 quant_scripts/learn_weights.py --emit-proposals

      - name: 推送月度提案报告
        if: always()
        continue-on-error: true
        env:
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          D=$(date +%Y-%m-%d)
          F="outputs/仲裁权重学习报告_${D}.md"
          if [ -f "$F" ]; then
            python3 quant_scripts/push_md.py --file "$F" --title "⚖️ 仲裁权重学习·月度提案 ${D}" || echo "推送失败(非致命)"
          else
            echo "未找到 $F，跳过推送"
          fi

      - name: 上传提案到知识库「报告/指标存档」
        if: always()
        continue-on-error: true
        env:
          IMA_OPENAPI_CLIENTID: ${{ secrets.IMA_OPENAPI_CLIENTID }}
          IMA_OPENAPI_APIKEY: ${{ secrets.IMA_OPENAPI_APIKEY }}
          IMA_KB_ID: 6kjd8jHpAyqf0xFVUo2xUWPaDAKapAWCw-Tki7V-aAs=
          IMA_FOLDER_ID: folder_7511239261453122
          IMA_SKIP_DUP: "1"
        run: |
          D=$(date +%Y-%m-%d)
          F="outputs/仲裁权重学习报告_${D}.md"
          if [ -f "$F" ]; then
            python3 upload_ima.py --file "$F" --name "$(basename "$F")" || echo "⚠️ 上传失败(非致命)"
          else
            echo "未找到 $F，跳过上传"
          fi

      # ── 第 5 环：回验（对已到期改动算超额收益；--apply 回填台账，权重不自动改）──
      - name: ② 权重改进回验（到期项）
        continue-on-error: true
        run: |
          python3 quant_scripts/weight_change_review.py --apply
          D=$(date +%Y-%m-%d)
          if [ -f "outputs/权重改进回验_${D}.md" ]; then
            echo "REVIEWED=1" >> "$GITHUB_ENV"
          else
            echo "REVIEWED=0" >> "$GITHUB_ENV"
          fi

      - name: 推送回验报告
        if: always() && env.REVIEWED == '1'
        continue-on-error: true
        env:
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          D=$(date +%Y-%m-%d)
          F="outputs/权重改进回验_${D}.md"
          python3 quant_scripts/push_md.py --file "$F" --title "🔁 权重改进回验 ${D}" || echo "推送失败(非致命)"

      - name: 提交提案 + 回验产物 + 台账
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          D=$(date +%Y-%m-%d)
          FILES="outputs/仲裁权重学习报告_${D}.md outputs/权重提案_${D}.json"
          if [ "${REVIEWED:-0}" = "1" ]; then
            FILES="$FILES outputs/权重改进回验_${D}.md logs/weight_change_ledger.csv"
          fi
          set +e
          python3 git_api_commit.py --msg "chore: 仲裁权重月度提案+回验 ${D}" $FILES
          RC=$?
          set -e
          if [ "$RC" != "0" ]; then
            echo "::warning::权重闭环产物提交失败(rc=$RC)"
          fi
