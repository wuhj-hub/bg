name: 仲裁权重自学习（月度·L1 闭环提议）

# ── 用途 ──────────────────────────────────────────────────────────────
# 把 learn_weights.py 的「统计 → 权重调整建议」升级为可消费的**结构化提案**，
# 为改进台账（logs/weight_change_ledger.csv）与回验脚本（weight_change_review.py）提供输入。
#
# ── 独立性声明（2026-10-10）───────────────────────────────────────────
#  · 本 workflow 为**纯新增**，不修改任何现有 workflow / 脚本默认行为；
#  · 只**读** outputs/仲裁信号日志.csv（该文件由主流水线 signal_arbiter 产出并提交，
#    本 workflow 不写它）→ 与主链路解耦；
#  · 产物为独立文件：outputs/仲裁权重学习报告_{date}.md + outputs/权重提案_{date}.json。
#  · 学习任务属「统计/提议」而非交易动作，故**不设交易日守卫**：避免月初落在
#    1/1、5/1、10/1 等法定假日时整月不跑（本任务在休市日运行无副作用）。
#
# ── 触发 ──────────────────────────────────────────────────────────────
on:
  schedule:
    - cron: '30 9 1 * *'          # 每月 1 日 北京 17:30（UTC 09:30）
  repository_dispatch:
    types: [weight-learn-run]
  workflow_dispatch: {}

permissions:
  contents: write                  # 提交提案产物（缺此声明 PUT 会 403）

concurrency:
  group: weight-learn
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: Asia/Shanghai            # 产物按北京日命名，与体系其它产物一致
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js（westock CLI 依赖）
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 westock CLI（免 npx 冷启动）
        run: npm i -g westock-data-skillhub@1.0.3

      - name: 预热 westock 数据包
        continue-on-error: true
        run: westock-data-skillhub kline sh000001 --period day --limit 5 > /dev/null 2>&1 || echo "预热未成功(非致命)"

      # 默认行为不变：不加 --emit-proposals 时只出 md 报告；此处开启以同时产出结构化提案
      - name: 权重学习 + 生成结构化提案
        run: python3 quant_scripts/learn_weights.py --emit-proposals

      - name: 推送月度提案报告
        if: always()
        continue-on-error: true
        env:
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          D=$(date +%Y-%m-%d)
          F="outputs/仲裁权重学习报告_${D}.md"
          if [ -f "$F" ]; then
            python3 quant_scripts/push_md.py --file "$F" --title "⚖️ 仲裁权重学习·月度提案 ${D}" || echo "推送失败(非致命)"
          else
            echo "未找到 $F，跳过推送"
          fi

      - name: 上传提案到知识库「报告/指标存档」
        if: always()
        continue-on-error: true
        env:
          IMA_OPENAPI_CLIENTID: ${{ secrets.IMA_OPENAPI_CLIENTID }}
          IMA_OPENAPI_APIKEY: ${{ secrets.IMA_OPENAPI_APIKEY }}
          IMA_KB_ID: 6kjd8jHpAyqf0xFVUo2xUWPaDAKapAWCw-Tki7V-aAs=
          IMA_FOLDER_ID: folder_7511239261453122
          IMA_SKIP_DUP: "1"
        run: |
          D=$(date +%Y-%m-%d)
          F="outputs/仲裁权重学习报告_${D}.md"
          if [ -f "$F" ]; then
            python3 upload_ima.py --file "$F" --name "$(basename "$F")" || echo "⚠️ 上传失败(非致命)"
          else
            echo "未找到 $F，跳过上传"
          fi

      - name: 提交提案产物
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          D=$(date +%Y-%m-%d)
          set +e
          python3 git_api_commit.py --msg "chore: 仲裁权重月度提案 ${D}" \
            "outputs/仲裁权重学习报告_${D}.md" \
            "outputs/权重提案_${D}.json"
          RC=$?
          set -e
          if [ "$RC" != "0" ]; then
            echo "::warning::权重提案产物提交失败(rc=$RC)"
          fi
