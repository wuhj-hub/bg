name: 回测周期（月度定期回归）

# 回测机制 v1.0 运维部分（2026-09-24）
# 纪律：report-only，不改代码；候选需「连续2期通过 + 人工确认」才落地
# 数据：data/bt_sample.json（400只固定样本，保证月度可复现）

on:
  # 可靠触发：由 evidence_review 链路内联（每月1日 09:05，已在 cron-job.org 验证）
  repository_dispatch:
    types: [bt-cycle-run]
  workflow_dispatch: {}

permissions:
  contents: write   # 必须：提交回测报告；缺此声明 PUT 会 403 且 step 仍报 success

concurrency:
  group: bt-cycle
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 回测周期回归（数据体检 + 基准 + 候选复核）
        id: cyc
        continue-on-error: true
        env:
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          set +e
          if [ -f data/bt_sample.json ]; then
            python3 quant_scripts/bt_cycle.py --data data/bt_sample.json --out outputs --push > /tmp/cyc.log 2>&1
            RC=$?
            tail -60 /tmp/cyc.log
          else
            echo "WARN: 缺少 data/bt_sample.json，本期跳过"
            RC=0
          fi
          set -e
          echo "rc=$RC" >> "$GITHUB_OUTPUT"

      - name: 提交回测报告
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          for f in outputs/回测周期_*.md outputs/bt_cycle_latest.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "无变更"
          else
            git commit -m "chore: 回测周期月度回归 $(date +%Y-%m)"
            git push
          fi

      - name: 异常告警
        if: always()
        env:
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          RC="${{ steps.cyc.outputs.rc }}"
          if [ "$RC" != "0" ]; then
            curl -s "https://pushplus.plus/send" -d "token=${PUSH_TOKEN}&title=⚠️回测周期异常&content=rc=${RC:-?}&template=txt" > /dev/null || :
            echo "::warning::回测周期回归异常 rc=$RC"
          else
            echo "OK 回测周期回归完成"
          fi
