name: 全盘量化扫描

on:
  schedule:
    # 北京时间 15:30（UTC 7:30），交易日收盘后自动运行
    - cron: "30 7 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write  # write for changelog auto-update

concurrency:
  group: panhou-lianghua
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js（westock npx 依赖）
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 Python 依赖（pandas+numpy for 猛兽）
        run: |
          pip install pandas numpy

      # ─── 第一步：生成主板清单 ───
      - name: 生成沪深主板清单
        run: python3 gen_mainboard.py

      # ─── 预热westock包（避免扫描时每只股票首次调用下载开销）───
      - name: 预热westock数据包
        run: npx -y westock-data-skillhub@1.0.3 hot board --limit 3

      # ─── 第二步：全量量化扫描 ───
      - name: 全量量化扫描（盘后量化）
        env:
          SCAN_WORKERS: "16"
        run: python3 full_market_dualdim.py all_mainboard.csv

      # ─── 第二步.5：动态生成鱼身股票池 ───
      - name: 动态生成鱼身股票池（近20日日均成交额排名前300）
        run: python3 quant_scripts/gen_fish_pool.py

      # ─── 第三步：三系统预运行 ───
      - name: 量化系统预运行（双弦+鱼身+猛兽）
        run: python3 quant_scripts/run_all_quant.py

      # ─── 第三步.5：提交量化汇总（供次日盘前报告引用三系统信号）───
      - name: 提交量化汇总到仓库（供盘前报告引用）
        run: |
          cp outputs/quant_results_$(date +%Y-%m-%d).json quant_results_latest.json 2>/dev/null || cp outputs/quant_results_latest.json quant_results_latest.json 2>/dev/null || true
          if [ -f quant_results_latest.json ]; then
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add quant_results_latest.json
            git commit -m "chore: update quant_results_latest ($(date +%Y-%m-%d))" || echo "no changes to commit"
            for i in 1 2 3; do
              git pull --rebase origin main --allow-unrelated-histories 2>/dev/null || true
              if git push origin main 2>/dev/null; then
                echo "[OK] quant_results_latest pushed (attempt $i)"
                break
              fi
              echo "push attempt $i failed, retry after 15s"
              sleep 15
            done
          fi

      # ─── 第四步：上传所有结果 ───
      - name: 上传全盘量化报告到全盘量化文件夹
        id: upload_main
        env:
          IMA_OPENAPI_CLIENTID: ${{ secrets.IMA_OPENAPI_CLIENTID }}
          IMA_OPENAPI_APIKEY: ${{ secrets.IMA_OPENAPI_APIKEY }}
          IMA_KB_ID: ${{ secrets.IMA_KB_ID }}
          IMA_FOLDER_ID: folder_7485264708529742
        run: |
          IMA_UPLOAD_OK=false
          IMA_CRED_EXPIRED=false
          for i in 1 2 3; do
            if python3 upload_ima.py --file panhou_lianghua.md --name "全盘量化报告_$(date +%Y-%m-%d).md" 2>upload_err.log; then
              IMA_UPLOAD_OK=true
              break
            fi
            if grep -Eq "401|skill auth failed|Unauthorized" upload_err.log; then
              IMA_CRED_EXPIRED=true
              echo "::error::ima credential expired (401) — 需重新生成并回填 GitHub secret"
              break
            fi
            echo "upload attempt $i failed, retry after $((i*10))s"
            sleep $((i*10))
          done
          echo "IMA_UPLOAD_OK=$IMA_UPLOAD_OK" >> "$GITHUB_ENV"
          echo "IMA_CRED_EXPIRED=$IMA_CRED_EXPIRED" >> "$GITHUB_ENV"

      # ─── 第五步：股池标的跟踪报告（三阶漏斗：月线反转→武威G1→v2.1质量否决）───
      # 先于复盘报告生成，供复盘③.5引用当日股池状态
      - name: 生成并上传股池标的跟踪报告（三阶漏斗）
        continue-on-error: true
        env:
          IMA_OPENAPI_CLIENTID: ${{ secrets.IMA_OPENAPI_CLIENTID }}
          IMA_OPENAPI_APIKEY: ${{ secrets.IMA_OPENAPI_APIKEY }}
          IMA_KB_ID: ${{ secrets.IMA_KB_ID }}
          IMA_FOLDER_ID: folder_7485264708529742
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          python3 quant_scripts/pool_tracking_report.py --push --auto-extend
          if [ -f "outputs/股池标的跟踪报告_$(date +%Y-%m-%d).md" ]; then
            python3 upload_ima.py --file "outputs/股池标的跟踪报告_$(date +%Y-%m-%d).md" --name "股池标的跟踪报告_$(date +%Y-%m-%d).md"
          fi

      # ─── 第五.5步：自动生成复盘报告并上传（含③.5股池三阶漏斗状态引用）───
      - name: 自动生成复盘报告并上传
        continue-on-error: true
        env:
          IMA_OPENAPI_CLIENTID: ${{ secrets.IMA_OPENAPI_CLIENTID }}
          IMA_OPENAPI_APIKEY: ${{ secrets.IMA_OPENAPI_APIKEY }}
          IMA_KB_ID: ${{ secrets.IMA_KB_ID }}
          IMA_FOLDER_ID: folder_7485234585035034
        run: |
          python3 quant_scripts/gen_review_report.py
          python3 quant_scripts/report_selfcheck.py --review "outputs/复盘报告_$(date +%Y-%m-%d).md" --today "$(date +%Y-%m-%d)" --alert || echo "自检发现问题(已推送报警), 不阻断流程"

      # ─── 第五.6步：股池信号实盘胜率跟踪（每日累积，2-4周后可对比回测）───
      - name: 股池信号实盘胜率跟踪
        continue-on-error: true
        env:
          IMA_OPENAPI_CLIENTID: ${{ secrets.IMA_OPENAPI_CLIENTID }}
          IMA_OPENAPI_APIKEY: ${{ secrets.IMA_OPENAPI_APIKEY }}
          IMA_KB_ID: ${{ secrets.IMA_KB_ID }}
          IMA_FOLDER_ID: folder_7485264708529742
        run: |
          python3 quant_scripts/win_rate_tracker.py --min-days 3
          if [ -f "outputs/股池信号胜率跟踪报告_$(date +%Y-%m-%d).md" ]; then
            python3 upload_ima.py --file "outputs/股池信号胜率跟踪报告_$(date +%Y-%m-%d).md" --name "股池信号胜率跟踪报告_$(date +%Y-%m-%d).md"
          fi

      # ─── 第五.7步：纸面组合跟踪（信号→虚拟持仓→每日盈亏，按方法分组对比）───
      - name: 纸面组合跟踪（选股方法对比）
        continue-on-error: true
        env:
          IMA_OPENAPI_CLIENTID: ${{ secrets.IMA_OPENAPI_CLIENTID }}
          IMA_OPENAPI_APIKEY: ${{ secrets.IMA_OPENAPI_APIKEY }}
          IMA_KB_ID: ${{ secrets.IMA_KB_ID }}
          IMA_FOLDER_ID: folder_7485264708529742
        run: |
          if [ ! -f "outputs/paper_portfolio.json" ]; then
            python3 quant_scripts/paper_tracker.py --init outputs/pool_signals_log.csv
          fi
          python3 quant_scripts/paper_tracker.py --update
          python3 quant_scripts/paper_tracker.py --report
          if [ -f "outputs/纸面组合跟踪报告_$(date +%Y-%m-%d).md" ]; then
            python3 upload_ima.py --file "outputs/纸面组合跟踪报告_$(date +%Y-%m-%d).md" --name "纸面组合跟踪报告_$(date +%Y-%m-%d).md"
          fi

      - name: 推送扫描结果到微信+邮件（完整版报告）
        if: always()
        env:
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
          PUSH_SERVICE: pushplus
          FULL_REPORT_FILE: /home/runner/work/bg/bg/panhou_lianghua.md
          RUN_NUMBER: ${{ github.run_number }}
          MAIL_ENABLED: ${{ secrets.MAIL_ENABLED }}
          MAIL_SMTP: ${{ secrets.MAIL_SMTP }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python3 push_notify.py

      # ─── 第六步：运行成功 → 自动更新CHANGELOG版本记录（仅在有新commit时触发）───
      - name: 自动更新版本记录到CHANGELOG
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 update_changelog.py

      # ─── 第七步：体系自检（健康评分 + 市场状态检测 + 自动修复）───
      - name: 体系自检 — 健康评分 / 市场状态 / 异常检测
        if: always()  # 即使上传失败也执行自检
        continue-on-error: true
        run: |
          echo "🔍 体系自检开始..."
          python3 self_check.py --csv panhou_lianghua.csv --mainboard all_mainboard.csv --fix
          echo "✅ 自检完成，结果写入 health_status.json"

      - name: 推送自检报告到微信
        if: always()
        continue-on-error: true
        env:
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          if [ -f health_status.json ]; then
            SCORE=$(python3 -c "import json; print(json.load(open('health_status.json'))['health_score'])")
            GRADE=$(python3 -c "import json; print(json.load(open('health_status.json'))['health_grade'])")
            REGIME=$(python3 -c "import json; print(json.load(open('health_status.json'))['market_regime'])")
            ISSUES=$(python3 -c "
            import json
            d=json.load(open('health_status.json'))
            all_i=[]
            for k,v in d.get('checks',{}).items():
                if isinstance(v,dict): all_i.extend(v.get('issues',[]))
            print('; '.join(all_i[:3]) if all_i else '无')
            ")
            MSG="🏥 体系自检报告 - $(date +%Y-%m-%d)\n\n健康评分: ${SCORE}/100 (${GRADE})\n市场状态: ${REGIME}\n问题摘要: ${ISSUES}"
            curl -s "https://pushplus.plus/send" -d "token=${PUSH_TOKEN}&title=🏥体系自检&content=${MSG}&template=txt" > /dev/null
          fi
