name: 全盘量化扫描

on:
  schedule:
    # 北京时间 15:30（UTC 7:30），交易日收盘后自动运行
    - cron: "30 7 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write  # write for changelog auto-update

concurrency:
  group: panhou-lianghua
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js（westock npx 依赖）
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 Python 依赖（pandas+numpy for 猛兽）
        run: |
          pip install pandas numpy

      # ─── 第一步：生成主板清单 ───
      - name: 生成沪深主板清单
        run: python3 gen_mainboard.py

      # ─── 预热westock包（避免扫描时每只股票首次调用下载开销）───
      - name: 预热westock数据包
        run: npx -y westock-data-skillhub@1.0.3 hot board --limit 3

      # ─── 第二步：全量量化扫描 ───
      - name: 全量量化扫描（盘后量化）
        env:
          SCAN_WORKERS: "16"
        run: |
          python3 full_market_dualdim.py all_mainboard.csv
          # 归档资金快照（含资金行为四态phase，供按四态胜率跟踪）
          cp panhou_lianghua.csv outputs/资金快照_$(date +%Y-%m-%d).csv || echo "归档失败(不影响扫描)"

      # ─── 第二步.1：市场宽度指标（黑石marketChangeDist启发：全主板涨跌家数分布）───
      - name: 市场宽度扫描（全主板涨跌家数分布）
        run: python3 market_width.py all_mainboard.csv

      # ─── 第二步.2：分时强度分析（黑石minuteMacd启发：信号股分时MACD+封板+尾盘方向）───
      - name: 分时强度分析（信号股分时MACD）
        continue-on-error: true
        run: python3 minute_strength.py --limit 20

      # ─── 第二步.3：板块资金共振（本地复算三维因子，盘前③.3引用；替代黑石外部API，自成一体）───
      - name: 板块资金共振（本地复算·无外部依赖）
        continue-on-error: true
        run: python3 sector_resonance_local.py

      # ─── 第二步.5：动态生成鱼身股票池 ───
      - name: 动态生成鱼身股票池（近20日日均成交额排名前300）
        run: python3 quant_scripts/gen_fish_pool.py

      # ─── 第三步：三系统预运行 ───
      - name: 量化系统预运行（双弦+鱼身+猛兽）
        env:
          IMA_OPENAPI_CLIENTID: ${{ secrets.IMA_OPENAPI_CLIENTID }}
          IMA_OPENAPI_APIKEY: ${{ secrets.IMA_OPENAPI_APIKEY }}
          IMA_KB_ID: ${{ secrets.IMA_KB_ID }}
        run: python3 quant_scripts/run_all_quant.py

      # ─── 第三步.4：上传三系统原始数据到知识库（供次日盘前报告引用，防止缺失）───
      - name: 上传三系统原始数据（鱼身/双弦/猛兽，盘前引用数据源）
        continue-on-error: true
        env:
          IMA_OPENAPI_CLIENTID: ${{ secrets.IMA_OPENAPI_CLIENTID }}
          IMA_OPENAPI_APIKEY: ${{ secrets.IMA_OPENAPI_APIKEY }}
          IMA_KB_ID: ${{ secrets.IMA_KB_ID }}
          IMA_FOLDER_ID: folder_7485264708529742
        run: |
          # 鱼身JSON+报告（原内部上传因无凭证静默失败，改为workflow统一上传）
          FISH_JSON=$(ls outputs/fish_body_enhanced_*.json 2>/dev/null | head -1)
          FISH_MD=$(ls outputs/鱼身报告_*.md 2>/dev/null | head -1)
          if [ -n "$FISH_JSON" ]; then
            python3 upload_ima.py --file "$FISH_JSON" --name "$(basename $FISH_JSON)" || echo "鱼身JSON上传失败"
          fi
          if [ -n "$FISH_MD" ]; then
            python3 upload_ima.py --file "$FISH_MD" --name "$(basename $FISH_MD)" || echo "鱼身报告上传失败"
          fi
          # 量化汇总JSON（盘前premarket_quant引用）
          QJSON=$(ls outputs/quant_results_$(date +%Y-%m-%d).json 2>/dev/null | head -1)
          if [ -n "$QJSON" ]; then
            python3 upload_ima.py --file "$QJSON" --name "$(basename $QJSON)" || echo "量化汇总上传失败"
          fi
          # 猛兽原始输出
          if [ -f "outputs/beast_results.txt" ]; then
            python3 upload_ima.py --file "outputs/beast_results.txt" --name "beast_results_$(date +%Y-%m-%d).txt" || echo "猛兽输出上传失败"
          fi

      # ─── 第三步.4.5：猛兽本月股池同步（分层构建+剔除+月度累积，上传知识库「猛兽」本月股池）───
      - name: 猛兽本月股池同步（主池/观察池分层 + 剔除不符合）
        continue-on-error: true
        env:
          IMA_OPENAPI_CLIENTID: ${{ secrets.IMA_OPENAPI_CLIENTID }}
          IMA_OPENAPI_APIKEY: ${{ secrets.IMA_OPENAPI_APIKEY }}
          IMA_KB_ID: 9wlJWgbFxvKhhxzobeMHSJ7_eaUmHutVQXMzeNxh4DM=
          IMA_FOLDER_ID: folder_7483172363202542
        run: |
          python3 quant_scripts/monthly_pool_sync.py --date "$(date +%Y-%m-%d)"
          F=$(ls outputs/猛兽本月股池_$(date +%Y-%m-%d).md 2>/dev/null | head -1)
          if [ -n "$F" ]; then
            python3 upload_ima.py --file "$F" --name "$(basename $F)" || echo "猛兽本月股池上传失败"
          fi

      # ─── 第三步.4.6：双弦每日报告+月度股池同步（收编sx2：上传知识库「双弦」+推送）───
      - name: 双弦每日报告+月度股池同步（收编sx2单一出口）
        continue-on-error: true
        env:
          IMA_OPENAPI_CLIENTID: ${{ secrets.IMA_OPENAPI_CLIENTID }}
          IMA_OPENAPI_APIKEY: ${{ secrets.IMA_OPENAPI_APIKEY }}
          IMA_KB_ID: zw56pWsoAd18wp9A_2-_vFFAPbG51UZsuaGyvynm66g=
          IMA_FOLDER_ID: folder_7484244066591607
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          # 每日报告 → 双弦KB「每日报告」文件夹（folder_7484244062400511）
          RPT=$(ls outputs/shuangxian_v2_$(date +%Y-%m-%d).md 2>/dev/null | head -1)
          if [ -n "$RPT" ]; then
            IMA_FOLDER_ID=folder_7484244062400511 python3 upload_ima.py --file "$RPT" --name "$(basename $RPT)" || echo "双弦每日报告上传失败"
            # PushPlus推送（复用push_report.py，PUSH_REPORT指向报告）
            PUSH_REPORT="$RPT" python3 push_report.py || echo "双弦推送失败(非致命)"
          fi
          # 月度股池 → 双弦KB「月度股池」文件夹
          python3 quant_scripts/dual_pool_sync.py --date "$(date +%Y-%m-%d)"
          F=$(ls outputs/双弦本月股池_$(date +%Y-%m-%d).md 2>/dev/null | head -1)
          if [ -n "$F" ]; then
            IMA_FOLDER_ID=folder_7484244066591607 python3 upload_ima.py --file "$F" --name "$(basename $F)" || echo "双弦本月股池上传失败"
          fi

      # ─── 第三步.5：市场风格轴（依赖市场宽度+猛兽双模式聚合，须在三系统预运行之后）───
      - name: 市场风格轴扫描（机构主导 vs 游资主导 + 猛兽双模式交叉验证）
        continue-on-error: true
        run: python3 market_style.py

      # ─── 第三步.5b：四维共振评分（政策/资金/筹码/关联方，依赖第二步panhou_lianghua.csv）───
      - name: 四维共振评分（政策/资金/筹码/关联方四维证据链）
        continue-on-error: true
        run: python3 quad_resonance.py --pool panhou_lianghua.csv --top 15

      # ─── 第三步.5c：六套信号仲裁（四维/猛兽/鱼身/双弦/乾坤统一排序，依赖四维+三系统输出）───
      - name: 六套信号仲裁（统一优先级排序）
        continue-on-error: true
        run: python3 signal_arbiter.py --top 20

      # ─── 第三步.5d：创业板/科创四维补充通道（代表性优化A·2026-08-11）───
      # 主板四维3032只为主通道；创业板300/301+科创688 约2600只补充扫描，输出独立文件不覆盖主版
      - name: 创业板/科创四维补充扫描（代表性补充通道）
        continue-on-error: true
        run: |
          python3 gen_mainboard.py --universe chinext_kcb
          if [ -f all_chinext_kcb.csv ]; then
            python3 quad_resonance.py --pool all_chinext_kcb.csv --top 20 --out-prefix 四维共振_chinext_kcb
          fi

      # ─── 第三步.6：提交量化汇总（供次日盘前报告引用三系统信号）───
      - name: 提交量化汇总到仓库（供盘前报告引用）
        run: |
          cp outputs/quant_results_$(date +%Y-%m-%d).json quant_results_latest.json 2>/dev/null || cp outputs/quant_results_latest.json quant_results_latest.json 2>/dev/null || true
          # 鱼身JSON一并提交（盘前premarket_fishbody从GitHub拉取，防止知识库上传失败导致缺失）
          cp outputs/fish_body_enhanced_*.json fish_body_latest.json 2>/dev/null || true
          cp outputs/鱼身报告_*.md 鱼身报告_latest.md 2>/dev/null || true
          # 市场宽度+市场风格轴JSON（盘前②.5/②.5.2从GitHub拉取）
          cp outputs/market_width_latest.json market_width_latest.json 2>/dev/null || true
          cp outputs/market_style_latest.json market_style_latest.json 2>/dev/null || true
          cp outputs/mode_aggregate_latest.json mode_aggregate_latest.json 2>/dev/null || true
          # 板块共振（本地复算）+ 乾坤A级金股（第四信号源）
          cp outputs/板块共振_latest.json 板块共振_latest.json 2>/dev/null || true
          cp outputs/qiankun_a_latest.json qiankun_a_latest.json 2>/dev/null || true
          cp outputs/四维共振_latest.json 四维共振_latest.json 2>/dev/null || true
          cp outputs/信号仲裁_latest.json 信号仲裁_latest.json 2>/dev/null || true
          cp outputs/四维共振_chinext_kcb_latest.json 四维共振_chinext_kcb_latest.json 2>/dev/null || true
          if [ -f quant_results_latest.json ] || [ -f fish_body_latest.json ]; then
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add quant_results_latest.json fish_body_latest.json 鱼身报告_latest.md market_width_latest.json market_style_latest.json mode_aggregate_latest.json 板块共振_latest.json qiankun_a_latest.json 四维共振_latest.json 信号仲裁_latest.json 四维共振_chinext_kcb_latest.json 2>/dev/null || git add quant_results_latest.json fish_body_latest.json
            git commit -m "chore: update quant/fish_latest ($(date +%Y-%m-%d))" || echo "no changes to commit"
            for i in 1 2 3; do
              git pull --rebase origin main --allow-unrelated-histories 2>/dev/null || true
              if git push origin main 2>/dev/null; then
                echo "[OK] quant_results_latest pushed (attempt $i)"
                break
              fi
              echo "push attempt $i failed, retry after 15s"
              sleep 15
            done
          fi

      # ─── 第四步：上传所有结果 ───
      - name: 上传全盘量化报告到全盘量化文件夹
        id: upload_main
        env:
          IMA_OPENAPI_CLIENTID: ${{ secrets.IMA_OPENAPI_CLIENTID }}
          IMA_OPENAPI_APIKEY: ${{ secrets.IMA_OPENAPI_APIKEY }}
          IMA_KB_ID: ${{ secrets.IMA_KB_ID }}
          IMA_FOLDER_ID: folder_7485264708529742
        run: |
          IMA_UPLOAD_OK=false
          IMA_CRED_EXPIRED=false
          for i in 1 2 3; do
            if python3 upload_ima.py --file panhou_lianghua.md --name "全盘量化报告_$(date +%Y-%m-%d).md" 2>upload_err.log; then
              IMA_UPLOAD_OK=true
              break
            fi
            if grep -Eq "401|skill auth failed|Unauthorized" upload_err.log; then
              IMA_CRED_EXPIRED=true
              echo "::error::ima credential expired (401) — 需重新生成并回填 GitHub secret"
              break
            fi
            echo "upload attempt $i failed, retry after $((i*10))s"
            sleep $((i*10))
          done
          echo "IMA_UPLOAD_OK=$IMA_UPLOAD_OK" >> "$GITHUB_ENV"
          echo "IMA_CRED_EXPIRED=$IMA_CRED_EXPIRED" >> "$GITHUB_ENV"

      # ─── 第五步：股池标的跟踪报告（三阶漏斗：月线反转→武威G1→v2.1质量否决）───
      # 先于复盘报告生成，供复盘③.5引用当日股池状态
      - name: 生成并上传股池标的跟踪报告（三阶漏斗）
        continue-on-error: true
        env:
          IMA_OPENAPI_CLIENTID: ${{ secrets.IMA_OPENAPI_CLIENTID }}
          IMA_OPENAPI_APIKEY: ${{ secrets.IMA_OPENAPI_APIKEY }}
          IMA_KB_ID: ${{ secrets.IMA_KB_ID }}
          IMA_FOLDER_ID: folder_7485264708529742
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          python3 quant_scripts/pool_tracking_report.py --push --auto-extend --holdings-file holdings.txt \
            || python3 quant_scripts/pool_tracking_report.py --date "$(date +%Y-%m-%d)" --auto-extend --holdings-file holdings.txt
          if [ -f "outputs/股池标的跟踪报告_$(date +%Y-%m-%d).md" ]; then
            python3 upload_ima.py --file "outputs/股池标的跟踪报告_$(date +%Y-%m-%d).md" --name "股池标的跟踪报告_$(date +%Y-%m-%d).md"
          fi

      # ─── 第五.5步：自动生成复盘报告并上传（含③.5股池三阶漏斗状态引用 + 反转数值信号池）───
      - name: 自动生成复盘报告并上传
        continue-on-error: true
        env:
          IMA_OPENAPI_CLIENTID: ${{ secrets.IMA_OPENAPI_CLIENTID }}
          IMA_OPENAPI_APIKEY: ${{ secrets.IMA_OPENAPI_APIKEY }}
          IMA_KB_ID: ${{ secrets.IMA_KB_ID }}
          IMA_FOLDER_ID: folder_7485234585035034
        run: |
          # 先运行反转数值周线扫描（≤10元），供复盘报告明日展望章节引用
          python3 quant_scripts/reversal_funnel_screener.py --weeks 2 --max-price 10 || echo "反转数值扫描失败, 复盘继续"
          python3 quant_scripts/gen_review_report.py
          python3 quant_scripts/report_selfcheck.py --review "outputs/复盘报告_$(date +%Y-%m-%d).md" --today "$(date +%Y-%m-%d)" --alert || echo "自检发现问题(已推送报警), 不阻断流程"

      # ─── 第五.6步：股池信号实盘胜率跟踪（每日累积，2-4周后可对比回测）───
      - name: 股池信号实盘胜率跟踪
        continue-on-error: true
        env:
          IMA_OPENAPI_CLIENTID: ${{ secrets.IMA_OPENAPI_CLIENTID }}
          IMA_OPENAPI_APIKEY: ${{ secrets.IMA_OPENAPI_APIKEY }}
          IMA_KB_ID: ${{ secrets.IMA_KB_ID }}
          IMA_FOLDER_ID: folder_7485264708529742
        run: |
          python3 quant_scripts/win_rate_tracker.py --min-days 3
          if [ -f "outputs/股池信号胜率跟踪报告_$(date +%Y-%m-%d).md" ]; then
            python3 upload_ima.py --file "outputs/股池信号胜率跟踪报告_$(date +%Y-%m-%d).md" --name "股池信号胜率跟踪报告_$(date +%Y-%m-%d).md"
          fi

      # ─── 第五.7步：纸面组合跟踪（信号→虚拟持仓→每日盈亏，按方法分组对比）───
      - name: 纸面组合跟踪（选股方法对比）
        continue-on-error: true
        env:
          IMA_OPENAPI_CLIENTID: ${{ secrets.IMA_OPENAPI_CLIENTID }}
          IMA_OPENAPI_APIKEY: ${{ secrets.IMA_OPENAPI_APIKEY }}
          IMA_KB_ID: ${{ secrets.IMA_KB_ID }}
          IMA_FOLDER_ID: folder_7485264708529742
        run: |
          if [ ! -f "outputs/paper_portfolio.json" ]; then
            python3 quant_scripts/paper_tracker.py --init outputs/pool_signals_log.csv
          fi
          python3 quant_scripts/paper_tracker.py --update
          python3 quant_scripts/paper_tracker.py --report
          if [ -f "outputs/纸面组合跟踪报告_$(date +%Y-%m-%d).md" ]; then
            python3 upload_ima.py --file "outputs/纸面组合跟踪报告_$(date +%Y-%m-%d).md" --name "纸面组合跟踪报告_$(date +%Y-%m-%d).md"
          fi

      # ─── 第五.8步：反转数值周线信号上传+推送（信号md已由复盘步骤生成）───
      - name: 反转数值周线信号上传推送
        continue-on-error: true
        env:
          IMA_OPENAPI_CLIENTID: ${{ secrets.IMA_OPENAPI_CLIENTID }}
          IMA_OPENAPI_APIKEY: ${{ secrets.IMA_OPENAPI_APIKEY }}
          IMA_KB_ID: ${{ secrets.IMA_KB_ID }}
          IMA_FOLDER_ID: folder_7485264708529742
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          if [ -f "outputs/反转数值周线信号_$(date +%Y-%m-%d).md" ]; then
            python3 upload_ima.py --file "outputs/反转数值周线信号_$(date +%Y-%m-%d).md" --name "反转数值周线信号_$(date +%Y-%m-%d).md"
            python3 quant_scripts/reversal_funnel_screener.py --push-only --file "outputs/反转数值周线信号_$(date +%Y-%m-%d).md" || true
          fi

      - name: 推送扫描结果到微信+邮件（完整版报告）
        if: always()
        env:
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
          PUSH_SERVICE: pushplus
          FULL_REPORT_FILE: /home/runner/work/bg/bg/panhou_lianghua.md
          RUN_NUMBER: ${{ github.run_number }}
          MAIL_ENABLED: ${{ secrets.MAIL_ENABLED }}
          MAIL_SMTP: ${{ secrets.MAIL_SMTP }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python3 push_notify.py

      # ─── 第六步：运行成功 → 自动更新CHANGELOG版本记录（仅在有新commit时触发）───
      - name: 自动更新版本记录到CHANGELOG
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 update_changelog.py

      # ─── 第七步：体系自检（健康评分 + 市场状态检测 + 自动修复）───
      - name: 体系自检 — 健康评分 / 市场状态 / 异常检测
        if: always()  # 即使上传失败也执行自检
        continue-on-error: true
        run: |
          echo "🔍 体系自检开始..."
          python3 self_check.py --csv panhou_lianghua.csv --mainboard all_mainboard.csv --fix
          echo "✅ 自检完成，结果写入 health_status.json"

      - name: 推送自检报告到微信
        if: always()
        continue-on-error: true
        env:
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          if [ -f health_status.json ]; then
            SCORE=$(python3 -c "import json; print(json.load(open('health_status.json'))['health_score'])")
            GRADE=$(python3 -c "import json; print(json.load(open('health_status.json'))['health_grade'])")
            REGIME=$(python3 -c "import json; print(json.load(open('health_status.json'))['market_regime'])")
            ISSUES=$(python3 -c "
            import json
            d=json.load(open('health_status.json'))
            all_i=[]
            for k,v in d.get('checks',{}).items():
                if isinstance(v,dict): all_i.extend(v.get('issues',[]))
            print('; '.join(all_i[:3]) if all_i else '无')
            ")
            MSG="🏥 体系自检报告 - $(date +%Y-%m-%d)\n\n健康评分: ${SCORE}/100 (${GRADE})\n市场状态: ${REGIME}\n问题摘要: ${ISSUES}"
            curl -s "https://pushplus.plus/send" -d "token=${PUSH_TOKEN}&title=🏥体系自检&content=${MSG}&template=txt" > /dev/null
          fi
