name: 产物入库审计

# 根治「脚本写了、但从不提交」的静默断链（2026-09-16 建立）
# 背景：连续出现三类同源故障 —— sector_component_em 空壳未入库、
#       market_width 路径分裂、乾坤A产物与资金快照从不提交（消费方读 3 周旧数据）。
# 本 workflow 每日静态比对「脚本写出的产物路径」与「workflow 提交列表」，
# 并把「被消费方读取却没提交」的列为高危告警。

on:
  # ⚠️2026-09-25：原生 cron 已停用（避免与 cron-job.org 的 artifact-audit-run 06:05 双触发；
  #   外部触发已连续稳定运行，观察期结束）。如需回退，取消下方注释即可。
  # schedule:
  #   # 每日 06:00 北京（UTC 22:00），在盘后链路跑完之后、盘前之前
  #   - cron: '0 22 * * *'
  repository_dispatch:
    types: [artifact-audit-run]
  workflow_dispatch:

permissions:
  contents: write   # 提交审计报告

jobs:
  # ─── 交易日守卫（2026-10-05：节假日/周末停止巡检）───
  trade_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ok: ${{ steps.g.outputs.is_trade_day }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 判断是否交易日
        id: g
        continue-on-error: true
        run: python3 quant_scripts/trade_day_check.py --github-output

  artifact-audit:
    needs: trade_gate
    if: needs.trade_gate.outputs.ok == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: artifact-audit
      cancel-in-progress: false
    env:
      # ⭐2026-10-02 时区修正：本 job 由外部 cron 在 UTC 22:05（= 北京次日 06:05）触发，
      #   而 runner 默认 UTC → 裸 `date`/`datetime.now()` 会把报告命名成「北京日 - 1」
      #   （实证：2026-10-02 06:05 生成的报告名为 artifact_audit_2026-10-01.md）。
      #   设 TZ 后 shell 的 date 与 Python 的 now() 同时变为北京时间，与复盘报告等产物口径一致。
      TZ: Asia/Shanghai
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 运行产物入库审计
        id: audit
        env:
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          set +e
          python3 quant_scripts/artifact_audit.py --repo . --out outputs --strict > /tmp/audit.log 2>&1
          RC=$?
          set -e
          cat /tmp/audit.log
          echo "rc=$RC" >> $GITHUB_OUTPUT
          # 统计高危数（用于告警文案）
          HR=$(python3 -c "import json;print(len(json.load(open('outputs/artifact_audit.json')).get('high_risk',[])))" 2>/dev/null || echo 0)
          echo "hr=$HR" >> $GITHUB_OUTPUT
          if [ "$RC" != "0" ]; then
            curl -s "https://pushplus.plus/send" \
              -d "token=${PUSH_TOKEN}&title=🔴产物入库审计发现高危断链&content=有${HR}个产物被消费方读取但从未提交,详见 outputs/artifact_audit_$(date +%Y-%m-%d).md&template=txt" > /dev/null || true
            echo "::warning::产物入库审计发现 ${HR} 个高危断链"
          fi

      - name: 提交审计报告
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "outputs/artifact_audit_$(date +%Y-%m-%d).md" outputs/artifact_audit_latest.md 2>/dev/null || true
          # 改用 Contents API 提交（git push 浅克隆+并发冲突曾致失败，API 绕开；与 quant_scan 一致）
          set +e
          python3 git_api_commit.py --msg "chore: 产物入库审计 ($(date +%Y-%m-%d))" \
            "outputs/artifact_audit_$(date +%Y-%m-%d).md" outputs/artifact_audit_latest.md outputs/artifact_audit.json
          RC=$?
          set -e
          if [ "$RC" != "0" ]; then
            echo "::warning::产物入库审计提交失败(rc=$RC)"
          fi
