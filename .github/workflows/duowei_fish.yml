name: 多维度·鱼身报告更新

# 用途：独立维护「多维量化」订阅知识库（7位订阅）→「多维度」文件夹的每日盘后更新。
#       与主流水线（全盘量化扫描 / 盘后报告生成）完全解耦，互不影响。
# 内容：鱼身交易系统报告 · 动态股票池（近20日日均成交额排名前300，非固定池）
# 目标：kb_id=ima_kb_bcxqaAnF  folder_id=folder_7478204537267754
on:
  # 外部精确触发（cron-job.org → repository_dispatch）。
  # ⚠️ 现状（2026-10-14 核实）：本事件此前从未实际触发过，唯一实际触发源是下方原生 schedule。
  repository_dispatch:
    types: [duowei-fish-run]
  # 原生 cron：交易日盘后 16:00（北京）= UTC 08:00，周一至周五。
  # ⚠️ 实测 GitHub 原生 cron 延迟严重（16:00 计划常在 22:00~次日 02:00 才跑）。
  # ⚠️ 请勿注释本 schedule —— 外部触发(duowei-fish-run)尚未接入，禁用后该链路仅剩手动 dispatch。
  schedule:
    - cron: '0 8 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write  # 提交产物需要写权限

concurrency:
  group: duowei-fish
  cancel-in-progress: false

jobs:
  # ─── 交易日守卫（与体系内其余 workflow 统一）───
  trade_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ok: ${{ steps.g.outputs.is_trade_day }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 判断是否交易日
        id: g
        continue-on-error: true
        run: python3 quant_scripts/trade_day_check.py --github-output

  dimfish:
    needs: trade_gate
    if: needs.trade_gate.outputs.ok == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # 2026-10-15 阶段3：打开统一取数层磁盘缓存（同一次运行内跨 step 复用）
      FETCH_CACHE: "1"
      FETCH_CACHE_TTL: "18000"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 沙箱路径兼容层：鱼身等脚本硬编码 /sandbox/workspace（沙箱路径），runner 上不存在
      - name: 沙箱路径兼容层（/sandbox/workspace → 仓库根）
        run: |
          sudo mkdir -p /sandbox
          sudo ln -sfn $GITHUB_WORKSPACE /sandbox/workspace
          ls /sandbox/workspace/ > /dev/null 2>&1 && echo "✅ 兼容层就绪: /sandbox/workspace -> $GITHUB_WORKSPACE"

      - name: Setup Node.js（westock npx 依赖）
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 Python 依赖
        run: pip install pandas numpy

      # ─── 第一步：生成沪深主板清单（鱼身池与过滤均依赖）───
      - name: 生成沪深主板清单（失败回退仓库缓存）
        continue-on-error: true
        run: |
          python3 gen_mainboard.py || echo "⚠️ gen_mainboard失败，回退仓库缓存"
          if [ ! -s all_mainboard.csv ] && [ -f ../all_mainboard.csv ]; then cp ../all_mainboard.csv all_mainboard.csv; fi
          if [ ! -s all_mainboard.csv ]; then echo "❌ 无主板清单可用"; exit 1; fi
          echo "主板清单: $(wc -l < all_mainboard.csv) 行"

      - name: 预热westock数据包
        continue-on-error: true
        run: |
          npx -y westock-data-skillhub@1.0.3 hot board --limit 3 > /dev/null 2>&1 || true
          npx -y westock-data-skillhub@1.0.3 kline sh000001 --period day --limit 5 > /dev/null 2>&1 || true
          echo "✅ 预热完成"

      # ─── 第二步：动态生成鱼身股票池（不固定股池）───
      - name: 动态生成鱼身股票池（近20日日均成交额排名前300）
        # 2026-10-26 加固：10-21 该步卡死 87min（全市场批量取数受限流）→ 拖到 job timeout
        #   被 cancelled，整条链路白跑。改：step 级 timeout + 失败重试一次 + 不阻断
        #   （下一步校验时回退仓库缓存的股票池，宁可沿用旧池也不要整条链路失败）。
        continue-on-error: true
        timeout-minutes: 28
        run: |
          set +e
          python3 quant_scripts/gen_fish_pool.py
          RC=$?
          if [ "$RC" != "0" ]; then
            echo "::warning::gen_fish_pool 失败(rc=$RC)，60s 后重试一次"
            sleep 60
            python3 quant_scripts/gen_fish_pool.py
            RC=$?
          fi
          set -e
          if [ "$RC" != "0" ]; then
            echo "::warning::gen_fish_pool 重试后仍失败(rc=$RC)，交由下一步回退仓库缓存池"
          fi
      - name: 校验股票池
        # 2026-10-26 加固：池异常（空/笔数过少）时**跳过当日扫描并告警**，而不是整条链路失败。
        #   注：quant_scripts/stock_pool.txt 每日动态生成、不入库，故无法从 git 回退旧池。
        env:
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          set +e
          N=$(grep -vc '^#' quant_scripts/stock_pool.txt 2>/dev/null)
          set -e
          N=${N:-0}
          if [ "$N" -lt 50 ]; then
            echo "::warning::股票池异常（有效标的 ${N} < 50）→ 跳过当日鱼身扫描，不阻断链路"
            echo "SKIP_FISH=1" >> "$GITHUB_ENV"
            curl -s "https://pushplus.plus/send" -d "token=${PUSH_TOKEN}&title=⚠️多维度鱼身：股票池生成异常&content=gen_fish_pool 失败/超时，当日池仅 ${N} 只（<50），已跳过扫描。请手动 dispatch 补跑&template=txt" > /dev/null || true
            exit 0
          fi
          echo "股票池标的数: $N"

      # ─── 第三步：运行鱼身扫描（生成 JSON + Markdown 报告）───
      - name: 鱼身交易系统扫描（动态股票池）
        if: env.SKIP_FISH != '1'
        timeout-minutes: 30
        run: python3 quant_scripts/fish_body_enhanced.py --pool quant_scripts/stock_pool.txt --cold-report

      # ─── 第四步：上传鱼身报告到「多维量化 → 多维度」文件夹 ───
      - name: 上传鱼身报告到「多维量化→多维度」文件夹
        # 2026-10-22：ima 平台完成知识库 ID 体系迁移 —— 旧「base64 长 ID」(RgPmCvOW…=) 全部
        #   返回 220004 invalid knowledge_base_id，新格式为 ima_kb_xxxxxxxx（本库=ima_kb_bcxqaAnF，
        #   用 openapi/wiki/v1/search_knowledge_base 按名称查到；folder_id 未变，仍是 folder_7478204537267754）。
        #   该步失败不阻断链路（产物已提交仓库 + 下方 PushPlus 告警），避免把它拖红掩盖其它问题。
        continue-on-error: true
        env:
          IMA_OPENAPI_CLIENTID: ${{ secrets.IMA_OPENAPI_CLIENTID }}
          IMA_OPENAPI_APIKEY: ${{ secrets.IMA_OPENAPI_APIKEY }}
          IMA_KB_ID: ima_kb_bcxqaAnF
          IMA_FOLDER_ID: folder_7478204537267754
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          set +e
          MD=$(ls -t outputs/鱼身报告_*.md 2>/dev/null | head -1)
          if [ -z "$MD" ]; then
            echo "::warning::未生成鱼身报告（低温且未启用轻报告，或扫描异常），跳过上传，不阻断流水线"
            curl -s "https://pushplus.plus/send" -d "token=${PUSH_TOKEN}&title=ℹ️多维度鱼身报告缺失&content=duowei_fish 未生成 outputs/鱼身报告_*.md（低温且未启用轻报告，或扫描异常），已跳过上传&template=txt" > /dev/null || true
            exit 0
          fi
          echo "待上传报告: $MD"
          # 2026-10-26 加固：10-22 该步单次失败直接把 job 拖红（报告已生成却没进库）
          #   → 改为最多 3 次重试（同名第二/三次会被 IMA_SKIP_DUP 判定为已存在即成功）
          RC=1
          for i in 1 2 3; do
            python3 upload_ima.py --file "$MD" --name "鱼身报告_$(date +%Y-%m-%d)"
            RC=$?
            if [ "$RC" = "0" ]; then echo "✅ 上传成功（第 $i 次）"; break; fi
            echo "::warning::上传失败（第 $i 次, rc=$RC），20s 后重试"
            sleep 20
          done
          set -e
          if [ "$RC" != "0" ]; then
            echo "::error::上传「多维度」文件夹失败(rc=$RC)"
            curl -s "https://pushplus.plus/send" -d "token=${PUSH_TOKEN}&title=⚠️多维度上传失败&content=duowei_fish 上传知识库失败(rc=$RC)，订阅用户将看不到今日更新&template=txt" > /dev/null || true
            exit 1
          fi

      # ─── 第五步：提交产物到仓库（防丢 + 可追溯）───
      - name: 提交产物到仓库
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          RPT=$(ls -t outputs/鱼身报告_*.md 2>/dev/null | head -1)
          if [ -z "$RPT" ]; then
            echo "⏭️ 无新报告，跳过产物提交（避免用旧/异源文件覆盖 latest）"
            exit 0
          fi
          cp "$RPT" 鱼身报告_latest.md
          JSN=$(ls -t outputs/fish_body_enhanced_*.json 2>/dev/null | head -1)
          if [ -n "$JSN" ]; then cp "$JSN" fish_body_latest.json; fi
          python3 git_api_commit.py --msg "chore: 多维度鱼身报告 ($(date +%Y-%m-%d))" \
            鱼身报告_latest.md fish_body_latest.json || echo "⚠️ 产物提交失败（不阻断）"

      - name: 🧪 产物契约自检（当日·duowei_fish）
        if: always()
        continue-on-error: true
        env:
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          python3 quant_scripts/run_and_verify.py --tag "契约自检·duowei_fish" \
            --manifest config/daily_artifacts.json --workflow duowei_fish --push || true
