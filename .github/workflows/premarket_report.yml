name: 盘前市场报告

on:
  # ⚠️ 双轨制统一：schedule停用（2026-08-05），盘前报告统一由 ima 生成（质量最高）
  # GitHub自动版JSON曾污染复盘验证链路（三系统空/板块取错列/关键位空）
  # schedule:
  #   # 北京时间 08:00（UTC 0:00），交易日盘前自动生成
  #   - cron: "0 0 * * 1-5"
  workflow_dispatch:
    inputs:
      manual_note:
        description: '手动触发说明'
        required: false
        default: 'ima统一生成盘前报告，本workflow仅保留手动兜底'

permissions:
  contents: write  # write for premarket_judgment commit (复盘报告引用)

jobs:
  premarket:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js（westock npx 依赖）
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 生成盘前市场报告
        env:
          IMA_OPENAPI_CLIENTID: ${{ secrets.IMA_OPENAPI_CLIENTID }}
          IMA_OPENAPI_APIKEY: ${{ secrets.IMA_OPENAPI_APIKEY }}
          IMA_KB_ID: ${{ secrets.IMA_KB_ID }}
        run: |
          python3 quant_scripts/gen_premarket_report.py
          python3 quant_scripts/report_selfcheck.py --premarket "premarket_judgment_$(date +%Y-%m-%d).json" --today "$(date +%Y-%m-%d)" --alert || echo "自检发现问题(已推送报警), 不阻断流程"

      - name: 提交盘前预判到仓库（供复盘报告真实验证）
        # 防阻断：提交失败不阻断后续推送
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 git_api_commit.py --msg "chore: update premarket judgment ($(date +%Y-%m-%d))" \
            premarket_judgment_latest.json "premarket_judgment_$(date +%Y-%m-%d).json" "盘前市场报告_$(date +%Y-%m-%d).md"

      - name: 推送盘前报告到微信
        if: always()
        env:
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
          PUSH_SERVICE: pushplus
        run: python3 push_notify.py
