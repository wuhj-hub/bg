name: 盘中监控

on:
  # ⚠️ 2026-09-19：原生 cron 已停用 —— 避免与 cron-job.org 双重触发（原生实测延迟 2-8h 不可靠，外部触发为准；如需回退删掉下方 # 即可）
#  schedule:
#    # 交易日 09:00~15:45 北京时间每15分钟 = UTC 01:00~07:45（脚本内判断交易时段）
#    # ⚠️ 2026-09-15 实测：GitHub 免费版 schedule 对低活跃 repo **降频 + 随机延迟数小时**——
#    #    理论应 28 次/交易日，实际仅 4.2 次/日、落在盘中的仅 2.3 次（覆盖率≈8%），
#    #    且从无 09:40-09:55 触发（导致开盘八法扫描阶段从未运行）。保留本 cron 作兜底。
#    - cron: '*/15 1-7 * * 1-5'
  # 外部精确触发（cron-job.org → repository_dispatch）—— 主通道，规避原生 cron 降频/丢单
  repository_dispatch:
    types: [intraday-monitor-run]
  workflow_dispatch:

jobs:
  # ─── 交易日守卫（2026-09-25 统一新增）───
  # 目的：cron-job.org 只能按"周一至周五"触发，无法感知 A股节假日
  #（中秋 9/25-9/27、国庆 10/1-10/7 等休市日仍会触发 → 空跑白耗算力）。
  # 判据：真实行情数据最新日期是否等于今天（自动适应任何节假日/临时休市，无需维护日历）。
  # 数据源不可用时保守放行（宁多跑一次，不漏跑）。
  trade_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ok: ${{ steps.g.outputs.is_trade_day }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 判断是否交易日
        id: g
        continue-on-error: true
        run: python3 quant_scripts/trade_day_check.py --github-output

  intraday-monitor:
    needs: trade_gate
    if: needs.trade_gate.outputs.ok == '1'
    runs-on: ubuntu-latest
    # ⚠️ 2026-09-15：原 15min 不够——开盘八法"补算扫描"实测耗时 649s(11min)+ 盘中监控 3.5min
    #    会正好撞上超时被 cancelled（首次补算当日尤其明显）。补算每日只发生一次，之后走监控(快)。
    # 2026-10-26：45 → 20min。开盘八法停用后，本 job 只剩「盘中监控」一步（实测 1.5~3.1min）
    #    + 检出/缓存/依赖各步，20min 已足够宽裕。
    timeout-minutes: 20
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 沙箱路径兼容层（2026-09-15 补）：脚本内硬编码 /sandbox/workspace/...，
      # 此前本 workflow 缺此步骤 → 池文件/输出路径全部失效（开盘八法候选池恒为 0）
      - name: 沙箱路径兼容层（/sandbox/workspace → 仓库根）
        run: |
          sudo mkdir -p /sandbox
          sudo ln -sfn $GITHUB_WORKSPACE /sandbox/workspace
          ls /sandbox/workspace/ > /dev/null 2>&1 && echo "✅ 兼容层就绪: /sandbox/workspace -> $GITHUB_WORKSPACE"

      # 当日日期（用于缓存 key，保证同一天内命中、跨天自动失效）
      - name: 取当日日期（北京时间）
        id: d
        run: echo "today=$(TZ=Asia/Shanghai date +%Y%m%d)" >> $GITHUB_OUTPUT

      # 🔕 2026-10-26：原「缓存当日开盘强形态池」步骤已随开盘八法一并移除（见下方停用说明）。

      - name: 设置 Node.js（westock npx 依赖）
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 恢复「王者信号当日去重状态」（2026-09-15 v2.0 新增）
      # 背景：王者封板信号每次运行都会全量命中当日涨停池，需跨次运行去重，避免每 15 分钟重复推送同一批。
      # 采用 restore+save 动态 key（GitHub cache 同 key 不可覆盖），restore-keys 前缀匹配取当日最新。
      - name: 恢复王者信号去重状态
        uses: actions/cache/restore@v4
        with:
          path: outputs/wangzhe_pushed.json
          key: wangzhe-pushed-${{ steps.d.outputs.today }}-${{ github.run_number }}
          restore-keys: |
            wangzhe-pushed-${{ steps.d.outputs.today }}-

      - name: 运行盘中监控
        env:
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
          PUSH_SERVICE: pushplus
          MAIL_ENABLED: ${{ secrets.MAIL_ENABLED }}
          MAIL_SMTP: ${{ secrets.MAIL_SMTP }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 intraday_monitor.py

      - name: 保存王者信号去重状态
        if: always()
        uses: actions/cache/save@v4
        with:
          path: outputs/wangzhe_pushed.json
          key: wangzhe-pushed-${{ steps.d.outputs.today }}-${{ github.run_number }}

      # ─────────────────────────────────────────────────────────────
      # 🔕 开盘八法（kaipan_8.py --auto）已于 2026-10-26 停用并移除
      # 实证结论（31 个交易日 / 3,051 只 / 91,349 条记录，样本 2026-09-03~10-23）：
      #   ① 形态强度与实际收益不单调：Spearman ρ=+0.144（p=0.73，n=8 种形态）；
      #      最强的三高盘 T+1 超额 −0.039%（倒数第二），强度 0 的多空胶着反而 +0.126%（p<0.001）。
      #   ② 强形态（强度≥3）T+1/T+3/T+5 超额 +0.003%/−0.028%/−0.055%（p=0.90/0.50/0.31）全部不显著；
      #      T+0 仅 +0.059%，低于双边成本（12~16bp）。
      #   ③ 实盘候选池（yao/caige/yitong 共 1,341 只）内更差且显著为负：
      #      T+1 超额 −0.094%（p=0.014），三高盘 T+1 −0.240%（p=0.0004），叠双标尺 −0.282%。
      #   ④ 量能标尺 vol_ratio 在 9:45 时点恒等于 16.000（全样本标准差 0、P60 通过率 100%）＝死代码；
      #      按真实运行时刻（09:50）才有区分度，但当量的是「后段缩量」，与放量确认语义相反，叠加后 T+1 超额 0.003%→−0.205%。
      #   ⑤ 突破 9:45 高点买入 T+0 超额仅 +0.030%（中位 −0.041%），不如 9:45 直接买入的 +0.059%。
      # 每次运行需全量补算 ~15.2min（当日缓存 key 从未写入，实测 total_count=0），
      # 每天 24 次 ≈ 6 小时 runner，且产出 581 只/日「强形态」却无可交易边际。
      # 脚本 quant_scripts/kaipan_8.py 保留归档，不再由任何 workflow 调用。
      # 回测报告：/sandbox/workspace/kp8_eval/report.md（结论可复现）
      # ─────────────────────────────────────────────────────────────

