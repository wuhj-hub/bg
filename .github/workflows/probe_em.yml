name: probe_em

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 腾讯ifzq板块接口参数调试
        run: |
          for U in \
            "https://proxy.finance.qq.com/cgi/cgi-bin/rank/hs/getBoardRankList?board_type=hy&sort_type=price&direct=down&offset=0&count=5" \
            "https://proxy.finance.qq.com/cgi/cgi-bin/rank/hs/getBoardRankList?board_type=gn&sort_type=price&direct=down&offset=0&count=5" \
            "https://proxy.finance.qq.com/cgi/cgi-bin/rank/hs/getBoardRankList?type=hy&sort_type=price&direct=down&offset=0&count=5" \
            "https://proxy.finance.qq.com/cgi/cgi-bin/rank/hs/getBoardRankList?board_code=hy&sort_type=price&direct=down&offset=0&count=5" \
            "https://proxy.finance.qq.com/cgi/cgi-bin/rank/hs/getBoardRankList?board_type=hy&sort_type=price&direct=down&offset=0&count=5&board_code=hy880001" \
            "https://proxy.finance.qq.com/cgi/cgi-bin/rank/hs/getStockListInBoard?board_code=hy880001&sort_type=price&direct=down&offset=0&count=5" \
            "https://proxy.finance.qq.com/cgi/cgi-bin/rank/hs/getStockListInBoard?board_code=gn880300&sort_type=price&direct=down&offset=0&count=5" ; do
            echo "--- $U"
            curl -s --max-time 8 "$U" -H "User-Agent: Mozilla/5.0" -H "Referer: https://gu.qq.com/" | head -c 300
            echo ""
          done

      - name: 备选板块数据源探测（腾讯ifzq/同花顺/东财备用域）
        run: |
          echo "=== 腾讯 proxy.finance.qq.com 板块排行 ==="
          curl -s --max-time 10 "https://proxy.finance.qq.com/cgi/cgi-bin/rank/hs/getBoardRankList?board_type=hy&sort_type=price&direct=down&offset=0&count=5" -H "User-Agent: Mozilla/5.0" -H "Referer: https://gu.qq.com/" | head -c 400
          echo ""
          echo "=== 同花顺 q.10jqka.com.cn 板块 ==="
          curl -s --max-time 10 "https://q.10jqka.com.cn/thshy/" -H "User-Agent: Mozilla/5.0" | head -c 300
          echo ""
          echo "=== 东财备用 push2his ==="
          curl -s --max-time 10 "https://push2his.eastmoney.com/api/qt/stock/kline/get?secid=1.000001&fields1=f1&fields2=f51&klt=101&fqt=0&beg=20260901&end=20260903" -H "User-Agent: Mozilla/5.0" | head -c 300
          echo ""
          echo "=== 腾讯 qt.gtimg.cn 板块指数行情 ==="
          curl -s --max-time 8 "https://qt.gtimg.cn/q=bkhy" -H "User-Agent: Mozilla/5.0" | head -c 300

      - name: 东财板块成分拉取（行业+概念，覆盖全市场含次新）
        run: |
          python3 quant_scripts/runner_fetch_em_sectors.py --out outputs/sector_component_em.json
          cp outputs/sector_component_em.json sector_component_em.json 2>/dev/null || true
          ls -la sector_component_em.json 2>/dev/null || echo "产物未生成"

      - name: 提交东财板块映射到仓库
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -f sector_component_em.json ]; then
            python3 git_api_commit.py --msg "feat: 东财板块成分映射(sector_component_em.json, 覆盖全市场含次新)" sector_component_em.json
          fi
