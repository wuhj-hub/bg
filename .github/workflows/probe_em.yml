name: probe_em

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 东财连通性诊断（curl直测）
        run: |
          echo "=== push2 直测 ==="
          curl -s --max-time 10 "https://push2.eastmoney.com/api/qt/clist/get?pn=1&pz=3&po=1&np=1&fltt=2&invt=2&fid=f3&fs=m%3A90%2Bt%3A2%2Bf%3A%2150&fields=f12%2Cf14" -H "User-Agent: Mozilla/5.0" -H "Referer: https://quote.eastmoney.com/" | head -c 500
          echo ""
          echo "=== 备用域名 push2his/20 ==="
          curl -s --max-time 10 "http://push2.eastmoney.com/api/qt/clist/get?pn=1&pz=3&po=1&np=1&fltt=2&invt=2&fid=f3&fs=m:90+t:2+f:!50&fields=f12,f14" -H "User-Agent: Mozilla/5.0" | head -c 300
          echo ""
          echo "=== 86.push2 ==="
          curl -s --max-time 10 "https://86.push2.eastmoney.com/api/qt/clist/get?pn=1&pz=3&po=1&np=1&fltt=2&invt=2&fid=f3&fs=m:90+t:2+f:!50&fields=f12,f14" -H "User-Agent: Mozilla/5.0" | head -c 300

      - name: 东财板块成分拉取（行业+概念，覆盖全市场含次新）
        run: |
          python3 quant_scripts/runner_fetch_em_sectors.py --out outputs/sector_component_em.json
          cp outputs/sector_component_em.json sector_component_em.json 2>/dev/null || true
          ls -la sector_component_em.json 2>/dev/null || echo "产物未生成"

      - name: 提交东财板块映射到仓库
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -f sector_component_em.json ]; then
            python3 git_api_commit.py --msg "feat: 东财板块成分映射(sector_component_em.json, 覆盖全市场含次新)" sector_component_em.json
          fi
