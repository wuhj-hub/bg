name: 涨停型王者跟踪

on:
  # ⚠️ 2026-09-19：原生 cron 已停用 —— 避免与 cron-job.org 双重触发（原生实测延迟 2-8h 不可靠，外部触发为准；如需回退删掉下方 # 即可）
#  schedule:
#    # 交易日盘后 15:35（北京）= UTC 07:35。⚠️ GitHub 免费版 cron 会降频/延迟 → 以 dispatch 为主通道
#    - cron: '35 7 * * 1-5'
  repository_dispatch:
    types: [wangzhe-track-run]
  workflow_dispatch:

# ⚠️ 必须显式声明写权限：github.token 默认只读，否则 commit 步骤 403 Forbidden
permissions:
  contents: write

concurrency:
  # ⭐2026-10-02: 防「外部 dispatch + 手动 dispatch」同时触发导致并发写仓库/重复推送
  group: wangzhe-track
  cancel-in-progress: false

jobs:
  # ─── 交易日守卫（2026-09-25 统一新增）───
  # cron-job.org 只能按"周一至周五"触发，无法感知 A股节假日（中秋/国庆等休市日仍触发→空跑）。
  # 判据：真实行情数据最新日期 == 今天（自动适应任何节假日与临时休市，无需维护日历）；
  #       数据源不可用时保守放行（宁多跑一次，不漏跑）。
  trade_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ok: ${{ steps.g.outputs.is_trade_day }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 判断是否交易日
        id: g
        continue-on-error: true
        run: python3 quant_scripts/trade_day_check.py --github-output
  wangzhe-track:
    needs: trade_gate
    if: needs.trade_gate.outputs.ok == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 脚本内引用 /sandbox/workspace 兼容路径（与体系其他脚本保持一致）
      - name: 沙箱路径兼容层
        run: |
          sudo mkdir -p /sandbox
          sudo ln -sfn $GITHUB_WORKSPACE /sandbox/workspace
          ls /sandbox/workspace/ > /dev/null 2>&1 && echo "✅ 兼容层就绪"

      - name: 设置 Node.js（westock npx 依赖）
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install pandas numpy -q

      # ① 筛选：抓当日实时涨停池 → **T日首板候选**（首板 + 换手>5% + **量比1.5~4** + 未炸板）
      #    ⚠️ 2026-09-16 修正：原实盘仅用「换手>5%」，会误收「高换手但未放量」的票（如600103青山纸业 换手11.88%但量比1.02）
      #    ⚠️ 输出是「T日候选」，非才哥原义的「王者倍量柱」（后者需 T+1~T+3 缩量站稳确认）
      # ② 跟踪：用 westock 更新近 45 日信号的 5/10/20 日收益
      # ③ 统计成功率 + 生成报告 + 推送
      - name: 筛选 + 跟踪 + 成功率统计
        env:
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          python3 quant_scripts/wangzhe_track.py --scan --update-live --stats --report --push

      # 涨停王者·合格标的漏斗（窗口 2026-08-01 起，逐条件过筛 A2~A5）
      - name: 涨停王者·合格标的漏斗
        continue-on-error: true
        run: python3 quant_scripts/wangzhe_funnel.py --since 2026-08-01

      # 合格标的 → 上传知识库（报告/全盘量化）+ 微信推送
      - name: 合格标的上传知识库 + 推送
        continue-on-error: true
        env:
          IMA_OPENAPI_CLIENTID: ${{ secrets.IMA_OPENAPI_CLIENTID }}
          IMA_OPENAPI_APIKEY: ${{ secrets.IMA_OPENAPI_APIKEY }}
          IMA_KB_ID: ${{ secrets.IMA_KB_ID }}
          IMA_FOLDER_ID: folder_7485264708529742
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          D=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          F="outputs/涨停王者_合格标的_${D}.md"
          if [ -f "$F" ]; then
            python3 upload_ima.py --file "$F" --name "$(basename "$F")" || echo "上传失败"
            python3 quant_scripts/push_md.py --file "$F" --title "涨停王者·合格标的 ${D}" || echo "推送失败"
          else
            echo "无当日合格标的文件，跳过"
          fi

      # 才哥公众号跟踪：解析 caige_urls.txt 中尚未处理的新文章 → 存档 + 汇总
      - name: 才哥公众号文章跟踪
        continue-on-error: true
        run: python3 quant_scripts/caige_track.py --sync --report

      - name: 提交信号库与报告入库
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 quant_scripts/wangzhe_commit.py
