name: 情绪温度计回测（月度）

on:
  schedule:
    - cron: "0 3 1 * *"        # 每月 1 日 11:00（北京时间）= 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: emotion-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 沙箱路径兼容层
        run: |
          sudo mkdir -p /sandbox
          sudo ln -sfn $GITHUB_WORKSPACE /sandbox/workspace
          ls /sandbox/workspace/ > /dev/null 2>&1 && echo "✅ 兼容层就绪"

      - name: Setup Node.js（westock npx 依赖）
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 预热 westock 数据包
        run: npx -y westock-data-skillhub@1.0.3 kline sh000001 --period day --limit 5 || true

      # 候选池：仓库根 all_mainboard.csv（quant_scan 产出）
      - name: 检查候选池
        run: |
          if [ -s all_mainboard.csv ]; then echo "✅ 候选池 $(wc -l < all_mainboard.csv) 行"; else echo "⚠️ 无候选池"; fi

      # 情绪温度计预测力回测（全主板日K重建涨停；120 交易日 ≈ 半年）
      - name: 运行回测（120 交易日）
        run: python3 quant_scripts/jinji_emotion_backtest.py --days 120 || true

      - name: 提交报告
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          for f in outputs/情绪温度计回测_*.md outputs/情绪温度计回测_latest.json; do
            [ -f "$f" ] && git add -f "$f"
          done
          if git diff --cached --quiet; then
            echo "无变更"
          else
            git commit -m "chore(情绪温度计回测): 月度更新 $(date +%F)"
            set +e
            git push
            RC=$?
            set -e
            if [ "$RC" != "0" ]; then
              echo "::warning::情绪温度计回测提交失败(rc=$RC)"
              curl -s "https://pushplus.plus/send" -d "token=${PUSH_TOKEN}&title=⚠️情绪温度计回测提交失败&content=git push 失败(rc=$RC)&template=txt" > /dev/null || true
            fi
          fi
