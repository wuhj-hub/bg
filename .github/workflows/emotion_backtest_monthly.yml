name: 情绪温度计回测（月度）

on:
  schedule:
    - cron: "0 3 1 * *"        # 每月 1 日 11:00（北京时间）= 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: emotion-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 沙箱路径兼容层
        run: |
          sudo mkdir -p /sandbox
          sudo ln -sfn $GITHUB_WORKSPACE /sandbox/workspace
          ls /sandbox/workspace/ > /dev/null 2>&1 && echo "✅ 兼容层就绪"

      - name: Setup Node.js（westock npx 依赖）
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 预热 westock 数据包
        run: npx -y westock-data-skillhub@1.0.3 kline sh000001 --period day --limit 5 || true

      # 候选池：仓库根 all_mainboard.csv（quant_scan 产出）
      - name: 检查候选池
        run: |
          if [ -s all_mainboard.csv ]; then echo "✅ 候选池 $(wc -l < all_mainboard.csv) 行"; else echo "⚠️ 无候选池"; fi

      # 情绪温度计预测力回测（全主板日K重建涨停；120 交易日 ≈ 半年）
      - name: 运行回测（120 交易日）
        env:
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          # 2026-10-23：原 `--days 120 || true` 会吞掉失败 —— 2026-10-01 那次 run 全绿，
          # 但产物至今停在 09-27（脚本实际没成功，提交步因无产物而静默跳过）。
          # 现捕获 rc：失败即 ::error:: + PushPlus 告警，并让步变红（月度任务失败必须可见）。
          RC=0
          python3 quant_scripts/jinji_emotion_backtest.py --days 120 || RC=$?
          if [ "$RC" != "0" ]; then
            echo "::error::情绪温度计回测失败(rc=$RC)，本月无回测产物"
            curl -s "https://pushplus.plus/send" -d "token=${PUSH_TOKEN}&title=⚠️情绪温度计回测失败&content=jinji_emotion_backtest 失败 rc=${RC}，本月无回测产物&template=txt" > /dev/null || echo "推送失败"
            exit 1
          fi

      - name: 提交报告
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          # 改用 Contents API 提交（git push 浅克隆+并发冲突曾致失败，API 绕开；与 quant_scan 一致）
          FILES=$(ls -1 outputs/情绪温度计回测_*.md outputs/情绪温度计回测_latest.json 2>/dev/null | tr '\n' ' ')
          if [ -n "$FILES" ]; then
            set +e
            python3 git_api_commit.py --msg "chore(情绪温度计回测): 月度更新 $(date +%F)" $FILES
            RC=$?
            set -e
            if [ "$RC" != "0" ]; then
              echo "::warning::情绪温度计回测提交失败(rc=$RC)"
              curl -s "https://pushplus.plus/send" -d "token=${PUSH_TOKEN}&title=⚠️情绪温度计回测提交失败&content=git_api_commit 失败(rc=$RC)&template=txt" > /dev/null || true
            fi
          else
            echo "无产物，跳过"
          fi

      - name: 🧪 产物契约自检（当日·emotion_backtest_monthly）
        if: always()
        continue-on-error: true
        env:
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          python3 quant_scripts/run_and_verify.py --tag "契约自检·emotion_backtest_monthly" \
            --manifest config/daily_artifacts.json --workflow emotion_backtest_monthly --push || true
